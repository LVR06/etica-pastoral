- Su propósito es bendecirlo y reconocerlo, como la certificación que se exige a los médicos o a los consejeros. Garantiza que sus doctrinas concuerdan con las de su denominación.
- H. Harvey dijo que los votos de la ordenación se hacen no solo al hombre, sino a Dios.
**Situaciones éticas:**
- Si el pastor llega a diferir en doctrinas fundamentales, debe entregar su certificado de ordenación y renunciar. **No es ético sacar a una iglesia de su denominación.**
- La autoridad no viene de la ordenación, sino de una conducta sana a lo largo de los años.
- Si el pastor tiene una caída moral, debe renunciar. Si no lo hace, la iglesia puede pedir su renuncia y la iglesia que lo ordenó puede pedir que devuelva su certificado. El autor cita el caso de una iglesia que lo hizo para proteger la moral del ministerio.` },
    { id: '5.3', t: 'La lealtad a la denominación', b: `El ministro debe pertenecer a su denominación por convicción, no por conveniencia. Por eso la defiende y acata las normas acordadas por la mayoría.
- **Las diferencias son normales.** Hay diferencias de interpretación y de métodos, como las hubo en tiempos de Pedro y Pablo. En las convenciones se discute, por ejemplo, cómo repartir el dinero para las misiones.
- **Seguir colaborando.** Cada uno puede expresar su opinión e intentar convencer a otros, pero si su plan no se aprueba, debe mantener la unidad y seguir colaborando.
- **La raíz del problema es el egoísmo**, que impide trabajar con eficacia. Hay más diferencias sobre cómo hacer la obra que sobre doctrina.
- **Conocer los estatutos** de la denominación y de la convención, y trabajar por los canales establecidos. No es ético usar medios ilícitos para provocar cambios.
- **Aceptar la decisión de la mayoría.** Los bautistas usan el proceso democrático. Retirarse del grupo solo se justifica en circunstancias muy críticas.
- **Aceptar la ayuda** de la denominación, como las campañas simultáneas y los programas de mayordomía y de educación cristiana. No se imponen, se ofrecen para ayudar.
- **La denominación es el canal** para que el pastor pase de una iglesia a otra, porque las iglesias piden recomendaciones a sus líderes.` },
    { id: 'Conclusión', t: 'Conclusión', b: `El joven ministro debe identificarse con su denominación, reconocer lo que le aporta y trabajar dentro de sus estructuras.
Si ve algo que debe cambiar, puede consultar y proponer por los métodos establecidos. Los líderes reciben con gusto las ideas creativas cuando ven que son un aporte positivo para la obra.` }
  ]
},
{
  n: 6, title: 'Normas éticas en las relaciones interdenominacionales', ring: 'Otras iglesias', frase: 'Respeto y cooperación con los de otras denominaciones.',
  resumen: {
    idea: 'El ministro debe respetar a los de otras denominaciones y cooperar con ellos en lo que une, sin perder su identidad ni su fe.',
    puntos: [
      'El enemigo común es la incredulidad, no las otras iglesias.',
      'Respetar la libertad de conciencia y no «robar ovejas».',
      'Formar un compañerismo de oración con pastores de otras denominaciones.',
      'Cooperar en campañas unidas, causas sociales, derechos legales y distribución de la Biblia.',
      'No colaborar en acuerdos de territorios, instituciones educativas compartidas ni en el movimiento ecuménico.',
      'Con otras religiones, no comprometer la fe ni orar sin el nombre de Jesús.',
      'El diálogo es útil y puede llevar a conversiones, pero ese no debe ser su fin principal.'
    ],
    recuerda: 'Se coopera en lo que une sin perder lo que distingue.'
  },
  subs: [
    { id: 'Intro', t: 'Introducción', b: `En décadas pasadas había polémica, competencia y hostilidad entre pastores de distintas denominaciones. Se hacían debates públicos sobre el bautismo de infantes, la inmersión o la aspersión, la predestinación y la infalibilidad de las Escrituras.
Hoy se reconoce que, si hay acuerdo en las doctrinas fundamentales, no hay razón para pelear por detalles. **El mayor enemigo es la incredulidad**, que se ve en la indiferencia espiritual, el materialismo y el secularismo.
El autor, criado en la lealtad bautista, se entrenó en ministerio pastoral en un hospital junto a ministros de otras denominaciones. Al hablar de creencias había grandes diferencias, pero al atender a personas en crisis usaban los mismos pasajes de consuelo. Aprendió que ante el sufrimiento la denominación no es lo decisivo.` },
    { id: '6.1', t: 'El respeto por las personas de otras denominaciones', b: `El respeto a las personas de otras denominaciones tiene dos partes: respetar su libertad de conciencia y formar una comunidad de fe con sus ministros.` },
    { id: '6.1.1', t: 'La libertad de conciencia', b: `Una doctrina fundamental de los bautistas es el respeto por las creencias de cada persona y su derecho a creer según su conciencia. Por eso no se debe criticar, menospreciar ni discutir con nadie por sus creencias.
- Hay que respetar a pentecostales, menonitas, presbiterianos y otros grupos, sin intentar que dejen su iglesia.
- Ellos tampoco deben tratar de atraer a los que nosotros ganamos. El autor vivió que, después de meses enseñando a unas familias, otros grupos intentaron llevárselas. Algunos usan la doctrina de la plenitud del Espíritu para hacer sentir a los creyentes que les falta algo.
- En una campaña con el equipo de Billy Graham, los Testigos de Jehová esperaban afuera a los recién convertidos para tomar sus direcciones. El autor considera que eso no es ético.
- **El ministro no debe parecer que «roba ovejas».** Si su mecánico es de otra iglesia, puede felicitarlo y preguntarle cómo le va, pero no invitarlo a su iglesia, salvo a una actividad de todas las denominaciones.` },
    { id: '6.1.2', t: 'La comunidad de fe', b: `Los ministros de varias denominaciones pueden formar un compañerismo espiritual de mucha bendición. Tienen intereses comunes y pueden ministrarse unos a otros. A veces un pastor comparte cosas más íntimas con un pastor de otra denominación que con los de la suya.
- En algunas ciudades se reúnen cada semana o cada quince días para compartir sus experiencias y sus penas, y para orar unos por otros.
- Así se rompen las barreras de comunicación y de división, y pueden apoyarse cuando una de sus familias tiene problemas.
- **El propósito debe ser siempre la oración y el compañerismo.** Si se meten actividades de promoción, la reunión pierde su tono espiritual. Los programas se tratan en otra reunión.` },
    { id: '6.2', t: 'Esferas de cooperación interdenominacional', b: `Hay varias áreas en que las denominaciones pueden cooperar: las campañas de evangelización, los proyectos de interés común, la defensa de los derechos legales y la distribución de la Biblia.` },
    { id: '6.2.1', t: 'Campañas de evangelización', b: `Se han hecho campañas unidas en que todas las denominaciones colaboran en la preparación. Al final, los nombres de los que hicieron profesión de fe se entregan a **la iglesia evangélica más cercana a su casa**. Así se han ganado muchos creyentes.
**Ventajas:**
- Donde se acusa a los evangélicos de estar divididos, muestra una unidad fundamental.
- Hay más dinero para publicidad, para el coro, para las reuniones y para el seguimiento de los nuevos creyentes.
- Se puede traer a un evangelista reconocido con su equipo y lograr un mayor impacto.
- Los coros de todas las iglesias forman un coro unido de mejor calidad.` },
    { id: '6.2.2', t: 'Proyectos de interés común', b: `Cuando un mal social o moral amenaza la ciudad, todas las iglesias pueden unirse para combatirlo. Las peticiones firmadas por el pueblo evangélico muestran a las autoridades que muchos ciudadanos quieren un cambio.
**El ejemplo de Colombia.** Hace años había mucha persecución contra los evangélicos. Se formó **CEDEC, la Confederación Evangélica de Colombia**, con personas encargadas de apelar ante las autoridades en cada caso. Informaron al país y al mundo de lo que pasaba, y poco a poco cesaron las persecuciones.
Las iglesias reportaban casos de niños perseguidos en los colegios y de pastores atacados por grupos fanáticos. Sin una organización unida no habría habido resultados.` },
    { id: '6.2.3', t: 'Apelación de derechos legales', b: `A veces los grupos evangélicos se unen para pedir a las autoridades la exoneración de ciertos impuestos, porque se reconoce que aportan mucho a la comunidad. Para lograrlo han tenido que contratar abogados y presentarse juntos, lo que tiene más impacto que ir uno por uno.
En España, hace años, las parejas que no eran católicas esperaban meses y hasta años para poder casarse por lo civil. Son casos de discriminación que no deben existir, y en muchos lugares los evangélicos han tenido que luchar con insistencia por sus derechos.` },
    { id: '6.2.4', t: 'Campañas de distribución de la Biblia', b: `La Sociedad Bíblica promueve campañas para distribuir la Biblia en hogares, colegios y negocios, y todos los evangélicos tienen interés en participar. Cada iglesia aporta personas que se entrenan para vender Biblias de casa en casa o en puestos en los centros comerciales.
**Beneficios para cada iglesia:**
- Los miembros se entrenan para testificar, reciben bendición personal y la iglesia crece.
- Aprenden más de la Biblia, porque la gente les hace preguntas y deben explicar sus creencias con pasajes bíblicos.` },
    { id: '6.3', t: 'Esferas de la no colaboración', b: `Hay áreas en que no conviene colaborar con otras denominaciones: los acuerdos de territorios misionales, las instituciones de educación compartidas y el movimiento ecuménico.` },
    { id: '6.3.1', t: 'Acuerdos de territorios misionales', b: `En el pasado algunos grupos evangélicos acordaron dividir un país y asignar regiones a cada uno.
**Por qué no conviene:**
- Cristo mandó predicar el evangelio a toda criatura. Un grupo con recursos y visión no debe ser limitado porque cierta región «le toca» a otro.
- Si un grupo no tiene fervor evangelizador, otro puede llevar el mensaje.
- Hacer cumplir esas reglas obliga a algunos a actuar como policías, lo que causa malentendidos y conflictos.
- Hay casos tristes en que el evangelio se atrasó en un país porque el grupo asignado no evangelizó.
**La excepción.** Al comenzar obra nueva en una ciudad, si ya hay tres o cuatro iglesias en un sector, es mejor abrir en otro sector donde no haya ninguna.` },
    { id: '6.3.2', t: 'Instituciones de educación', b: `A veces se propone que varias denominaciones sostengan juntas una institución teológica, con dinero, profesores y administradores. Los bautistas tienden a no participar.
**Las razones:**
- Una institución así da un sonido incierto en su teología, porque exige tolerar todas las creencias.
- Es difícil decidir cuánto debe aportar cada denominación, y con los años vienen los malentendidos.
- Si un grupo decide separarse, no es claro cómo dividir la inversión.
**La alternativa:** que cada denominación tenga su propia institución, o que envíe a sus alumnos a otra pagando lo que cuesta. Puede cobrar más a los alumnos de otras denominaciones. Así se evitan los conflictos.` },
    { id: '6.3.3', t: 'El movimiento ecuménico', b: `Desde la fundación del Concilio Federal de Iglesias, después llamado Concilio Mundial de Iglesias, se ha presionado a los bautistas para unirse. La mayoría no ha querido participar. Justo Anderson escribió la historia de esa relación.
**Las razones:**
- El movimiento ha optado por un **evangelio social**, que busca resolver la pobreza, el hambre, la opresión y el analfabetismo, en vez de ir al corazón del problema, que es la necesidad de una experiencia personal con Cristo.
- El autor menciona casos en que esa organización ayudó a grupos guerrilleros, lo que considera peligroso y contrario a la libertad de conciencia y a la separación entre la iglesia y el Estado.
**La postura del autor.** El mejor aporte es predicar el evangelio e invitar a las personas a aceptar a Cristo, porque esa transformación impacta todas las áreas de la vida. Los cristianos deben ayudar a resolver los problemas sociales, pero ese no es su enfoque principal. Se puede hacer más con los programas propios que dando dinero a una organización interdenominacional.` },
    { id: '6.4', t: 'Reuniones con personas de otras religiones', b: `Hoy hay más contacto con personas de otras religiones, como judíos, musulmanes y budistas. Las reuniones de compañerismo e intercambio están bien **si no comprometen nuestras creencias**.
- **Un ejemplo.** Si a uno lo invitan a orar en una reunión pero le piden no hacerlo en el nombre de Jesús para no ofender a los judíos, el autor cree que no debe aceptar.
- Con otras religiones hay poco terreno común de fe para planificar programas juntos.
- Compartir y comparar creencias puede ser útil, pero no si se comunica la idea de que todas las religiones llevan al mismo lugar.` },
    { id: '6.5', t: 'El diálogo con otros', b: `El autor reconoce que hasta aquí presentó una postura más bien cerrada. Como algunos tienen más inclinación a colaborar, explica qué es el diálogo y cuáles son sus objetivos.` },
    { id: '6.5.1', t: '¿Qué es el diálogo?', b: `La palabra **diálogo** viene del griego. *Dia* quiere decir «por medio de» o «a través de», y *logos* quiere decir «palabra». Es la comunicación entre dos o más personas por medio de las palabras.
Se refiere a una reunión formal en la que se explican puntos de vista diferentes para llegar a una comprensión más amplia o a un acuerdo.
Glenn Ingleheart, de la Convención Bautista del Sur, dice que para que el diálogo dé fruto, los participantes deben representar unidad y diversidad, y venir de distintos lugares, culturas y disciplinas.` },
    { id: '6.5.2', t: 'Los objetivos del diálogo', b: `Ingleheart propone dialogar para:
- Participar en la investigación teológica que busca una comunión cristiana mundial.
- Compartir lo aprendido en el estudio de la Biblia, la historia, la enseñanza, las misiones, la evangelización y la libertad religiosa.
- Elaborar una teología para nuestra época y compartir los métodos misioneros que funcionan.
- Aprender a enfrentar el despertar del islam y la ideología marxista.
**¿Se dialoga para convertir?**
- Luther Copeland dice que con otras religiones se debe dialogar sin intención de convertir.
- Ebbie Smith distingue entre el diálogo y el testimonio evangelizador.
- El autor cree que el diálogo sí puede llevar a la conversión y que no hay que descartarlo como medio, pero que no debe ser la meta principal.
El autor se reunía con universitarios para dialogar sobre temas religiosos y seculares. Cuando hay respeto y no se busca la polémica, se logra mucho. Ruel Howe dice que los líderes religiosos están tan acostumbrados al monólogo que les cuesta dialogar, porque dialogar exige escuchar y esforzarse por entender al otro.
Los bautistas tienen fama de cerrados, pero hay mucho que aprender y mucho que aportar en el diálogo.` },
    { id: 'Conclusión', t: 'Conclusión', b: `La puerta que antes estaba cerrada con candado se está abriendo un poco. Sigue la resistencia al ecumenismo, porque los bautistas prefieren cumplir la Gran Comisión con sus propios recursos, lo que les da más flexibilidad.
Pero hay disposición a colaborar con otros evangélicos en muchos proyectos y un interés creciente en dialogar con evangélicos, católicos, judíos y otras religiones. Los ministros de América Latina tendrán más oportunidades y deben estar atentos y dispuestos a dar su punto de vista.` }
  ]
},
{
  n: 7, title: 'Relaciones en la comunidad', ring: 'Comunidad', frase: 'La sociedad: buen ciudadano, voz moral y levadura.',
  resumen: {
    idea: 'El ministro es levadura en la sociedad. Debe ser buen ciudadano, voz moral y agente de cambio por medios legítimos y espirituales.',
    puntos: [
      'Pagar impuestos, votar informado y obedecer las leyes.',
      'Su opinión pesa más que la de otros, por eso debe estar bien informado.',
      'En los actos públicos representa a todos y no promueve su iglesia.',
      'En un jurado debe guardar las confidencias y ser hombre de misericordia y no de juicio.',
      'No debe llevar armas, aunque puede servir como capellán.',
      'Debe denunciar la injusticia y buscar cambios dentro del proceso político.',
      'Cuatro pasos en un mundo convulsionado: informarse, informar, dialogar y orar.'
    ],
    recuerda: 'El último círculo vuelve al centro: la fuerza para actuar en la sociedad viene de la oración.'
  },
  subs: [
    { id: 'Intro', t: 'Introducción', b: `El libro ha ido del centro hacia afuera: el ministro consigo mismo, su familia, la iglesia local, su denominación y las otras denominaciones. Ahora llega a la última relación, la comunidad en general.
El ministro es llamado a ser **levadura en la sociedad**, como todo cristiano. Eso significa ganar a otros para Cristo por medio de la evangelización personal y de las actividades de la iglesia. También significa influir para que la sociedad se moldee cada vez más según el evangelio, extendiendo el amor, la justicia y la paz.` },
    { id: '7.1', t: 'Consideraciones generales', b: `El ministro se relacionará con personas que piensan muy distinto. Debe expresar sus convicciones con sinceridad, sin ofender, y ser amable con quienes opinan diferente.` },
    { id: '7.1.1', t: 'Deberes de ciudadano o residente', b: `El ministro está sujeto a las leyes del país donde es ciudadano, y si vive en otro país como residente, también debe obedecer sus leyes. Debe ser ejemplo como ciudadano cristiano:
- **Pagar los impuestos** donde es ciudadano y donde reside, si la ley lo exige.
- **Votar** en las elecciones, informándose de las propuestas de los candidatos y votando según su conciencia.
- **Obedecer las leyes** y ser ejemplo para los demás.
**Su opinión tiene más peso.** El ministro es una persona influyente, y muchos adoptan sus opiniones porque confían en su juicio. Es un servidor de la comunidad, como el médico, el juez o el abogado. Por eso los medios lo entrevistan sobre temas como el divorcio, el aborto o la ética médica. Debe estar bien informado y saber expresarse con claridad.` },
    { id: '7.1.2', t: 'Funciones especiales', b: `A veces invitan al ministro a dar la invocación en una reunión especial, a orar en la dedicación de un edificio o en otro acto oficial. En los países católicos eso lo hace casi siempre el sacerdote, pero a veces le toca al pastor evangélico.
- **Representa a todo el pueblo**, con sus distintas posiciones espirituales. No debe aprovechar para promover su iglesia ni invitar a sus actividades. Solo invoca la presencia de Dios sobre la comunidad. Los religiosos lo agradecen y los no religiosos se quedan pensando en esos valores.
- **Capellanías.** En algunos países las sesiones legislativas empiezan con oración y hay capellanes para los legisladores. Es una oportunidad importante que no se debe tomar con indiferencia ni sin preparación. Así como Isaías aconsejó a los reyes, algunos ministros pueden tener esa oportunidad hoy.
- **Consolar a los líderes.** Los gobernantes pasan momentos de soledad y sufrimiento. Se les pueden enviar cartas de consuelo o de felicitación, y no las olvidan.
- **Equipos deportivos.** También pueden tener un capellán que atienda su vida espiritual.` },
    { id: '7.1.3', t: 'Participación en el jurado', b: `En algunos países los ciudadanos forman jurados para decidir si un acusado es culpable o inocente. A veces el ministro está exento, porque se considera que siempre está del lado de la persona necesitada. En otros países debe presentarse si lo citan.
- El ministro debe **guardar las confidencias** que recibe. Las personas deben sentirse libres de confesarle sus pecados, por eso es mejor que no tenga que testificar a favor ni en contra de un acusado.
- Es mejor que el ministro sea visto como **un hombre de misericordia y no de juicio**.
- Las normas cambian según las leyes de cada país. Donde los gobiernos son hostiles a la religión o a los evangélicos, el pastor debe orar y pedir dirección a Dios en cada caso.` },
    { id: '7.1.4', t: 'Participación en la guerra', b: `La guerra es un problema moral que perturba a todos. En muchos países el ministro reconocido por su denominación está exento del servicio militar, salvo como capellán.
- Si el ministro quiere ser capellán, no hay nada en contra, y tendrá muchas oportunidades de ministrar a los soldados.
- Pero el autor cree que **el ministro no debe llevar armas**, porque es contradictorio predicar el valor de la vida humana y a la vez tener que matar.
- Es un problema serio para los jóvenes llamados al servicio militar obligatorio que sienten el llamado al ministerio. Los líderes de las denominaciones pueden influir para que se respeten sus convicciones y para cambiar esas políticas.` },
    { id: '7.2', t: 'La intervención en programas de reforma social', b: `Algunos ven al ministro como un reformador social. Sin duda debe predicar todo el evangelio, y eso incluye **condenar las injusticias** sociales, morales y económicas.
Impresionan los mensajes de Amós, Miqueas, Oseas e Isaías, y las palabras de Jesús contra la opresión de su tiempo. Jesús, citando Isaías 61:1-2, habló de «pregonar libertad a los cautivos, y vista a los ciegos, poner en libertad a los oprimidos, predicar el año agradable del Señor» (Lc 4:18-19).` },
    { id: '7.2.1', t: 'El alcance de la intervención cristiana', b: `Siempre se ha debatido si la iglesia debe intervenir directamente en la política para lograr reformas. Algunos dicen que hay que luchar por la justicia, incluso con armas y uniéndose a grupos que buscan derrocar al gobierno.
**La postura del autor:**
- El ministro debe examinar bien su conciencia antes de identificarse con grupos así.
- Debe luchar, y animar a otros a luchar, **dentro del proceso político establecido**, buscando leyes que favorezcan a los pobres y oprimidos. Se puede abogar por la justicia y ser buen ciudadano a la vez.
- Si después de luchar ve que no hay posibilidad de más justicia, tendrá que decidir si toma un camino más radical. Antes debe preguntarse con qué grupo se va a unir y si ese grupo apoya los principios cristianos.
**El fin y los medios.** Hay presión para que los pastores lleven a los evangélicos a grupos que luchan por la libertad, la paz y la justicia. El fin es bueno, pero hay que mirar los medios. En tiempos de Isaías, Dios no aprobó la alianza con naciones paganas. Si esos movimientos tienen bases ateas y materialistas, unirse a ellos sería **vender la primogenitura por un guisado**. Algunos se aliaron y terminaron presos de sus aliados.` },
    { id: '7.2.2', t: 'La clase de intervención', b: `El pastor está en un lugar estratégico para guiar a su pueblo por caminos sanos. Necesita equilibrio mental, moral y espiritual para leer las señales de los tiempos y no vender su alma ni la de sus feligreses. Su tarea principal es **predicar el evangelio y dejar que su poder transforme la sociedad**, cambiando los corazones.
**Situaciones difíciles:**
- Si grupos extremistas exigen dinero a la iglesia para la revolución o se llevan a los jóvenes para entrenarlos, es momento de **pedir ayuda y protección a las autoridades**.
- Si se cede ante los grupos que secuestran y presionan a los gobiernos, las consecuencias serán peores.
- Hay preguntas reales sin solución fácil. ¿Qué decir al miembro pobre que pregunta si puede participar en una invasión de terrenos para tener un techo? ¿Y al trabajador que debe unirse a una huelga o arriesgarse a ser herido o despedido? El autor confiesa que **no hay una solución fácil**.` },
    { id: '7.2.3', t: 'Recursos espirituales para la intervención', b: `Se puede animar a los cristianos a ejercer su fe y orar de todo corazón pidiendo la ayuda de Dios. Así como Dios respondió a su pueblo en peligros pasados, se puede confiar en que lo socorrerá hoy.
También se puede ser constante en el trabajo y buen mayordomo de lo poco que se tiene. Dios promete más oportunidades a quien es **fiel en lo poco** (Lc 19:17). Quien trabaja bien, administra bien lo que tiene y aprovecha sus oportunidades progresa, sobre todo si tiene fe en Cristo y es fiel en su vida espiritual.` },
    { id: '7.3', t: 'El papel del ministro en un mundo convulsionado', b: `Por ser ministro del evangelio, el pastor está en un lugar crítico y estratégico.
- **Crítico**, porque es peligroso. Cualquier opinión que exprese será criticada por alguien, y apoyar un programa lo aleja de otros.
- **Estratégico**, porque puede usar su influencia para hacer mucho bien.
Si está seguro de que Dios lo guía, puede luchar de todo corazón y otros lo seguirán. Para eso debe seguir cuatro pasos:
1. Informarse bien.
2. Informar bien a sus feligreses.
3. Dialogar ampliamente.
4. Orar diligentemente.` },
    { id: '7.3.1', t: 'El pastor debe informarse bien', b: `Muchas decisiones se toman sin información suficiente. **Los médicos no operan sin conocer el problema** y los riesgos, pero a veces los pastores entran en una campaña o un proyecto sin saber lo que implica, y cuando ya están dentro se dan cuenta de que no era lo que pensaban.
Por eso el pastor debe informarse sobre todo proyecto del gobierno o de otras organizaciones que pidan su colaboración. Debe seguir lo que pasa en su país y, sobre todo, en su ciudad y en su barrio, y asegurarse de que participar no comprometa su testimonio.` },
    { id: '7.3.2', t: 'El pastor debe informar bien a sus feligreses', b: `Al estar bien informado, el pastor puede advertir a sus feligreses de los peligros y de las necesidades que traen los movimientos nacionales e internacionales. Muchos agradecen una perspectiva cristiana. Hay médicos que felicitan a su pastor por defender la santidad de la vida en el debate sobre el aborto.
**Informarse no basta.** Hay que meditar con calma, considerar las alternativas y sus consecuencias, unir la información con la fe y tomar en cuenta los valores morales que están en juego.
**El ejemplo del avión secuestrado.** Cuando uno no tiene que decidir, opina con facilidad sobre qué hacer con los rehenes. Pero quien debe ordenar un rescate, sabiendo que pueden morir, piensa mucho antes de actuar. Es fácil hablar con valentía cuando no nos toca decidir. La responsabilidad nos hace más serios y pacientes.` },
    { id: '7.3.3', t: 'El pastor debe dialogar ampliamente', b: `Cuanto más grave es la decisión, más necesita el pastor el consejo de otros. Es importante tener cristianos con quienes dialogar para recibir información y sugerencias. El diálogo amplía el conocimiento y da más seguridad al decidir.
Los Proverbios lo enseñan: **«Donde no hay dirección sabia, caerá el pueblo, mas en la multitud de consejeros hay seguridad»** (Pr 11:14).
Los jueces antiguos escuchaban a los testigos antes de decidir, y los líderes políticos de hoy tienen consejeros especialistas. El pastor también necesita consejeros en lo espiritual.` },
    { id: '7.3.4', t: 'El pastor debe orar diligentemente', b: `Muchas veces tenemos la tentación de confiar en la protección humana o política, cuando tenemos en Dios un recurso mucho más poderoso. La Biblia muestra cómo Dios intervino para cambiar la historia.
**El ejemplo de Ezequías.** El ejército de Senaquerib, rey de Asiria, estaba listo para invadir Judá y todos tenían miedo. El rey Ezequías acudió al profeta Isaías, que le dijo que confiara en Dios. «Y salió el ángel de Jehová y mató a ciento ochenta y cinco mil en el campamento de los asirios» (Is 37:36).
Se dice que cuando al hombre se le acaban los recursos, Dios comienza a actuar. Pero es mejor confiar en Dios **mientras uno hace todo lo posible** por resolver los problemas.
Es tiempo de ser optimistas. Dios no nos ha abandonado y tiene el control del universo. Debemos entregarnos a Él como barro en las manos del Alfarero, para que nos haga un vaso útil para su servicio.` },
    { id: 'Conclusión', t: 'Conclusión', b: `El mayor desafío del ministro de hoy es **relacionarse con las personas de afuera de la iglesia**, porque son las que se deben ganar para Cristo. Debe relacionarse bien en las áreas política, económica y social para comunicarles el amor de Dios.
El ministro que se separa de los inconversos se aísla. El que se identifica con ellos para comunicarles el evangelio enfrenta un gran desafío. En su vida normal como ciudadano encontrará oportunidades de testificar, de forma directa o con una palabra suave a favor de Cristo, sabiendo que Dios dará el crecimiento a la semilla sembrada.` }
  ]
}

  { c: 1, title: 'Une cada personaje con lo que hizo', pairs: [['Moisés', 'Fue mediador cuando Dios dio los Diez Mandamientos'], ['Natán', 'Declaró a David su pecado'], ['Elías', 'Denunció a Acab por la viña de Nabot'], ['Judas', 'Era ladrón de corazón'], ['Jacob', 'Llamó a su familia a volver a Dios']] },
  { c: 2, title: 'Une cada tipo de salud con lo que pide el libro', pairs: [['Salud emocional', 'Equilibrio y dominio propio'], ['Salud física', 'Ejercicio, descanso y examen médico'], ['Salud intelectual', 'De tres a cuatro horas diarias de estudio'], ['Salud espiritual', 'Tiempo diario personal con la Biblia y la oración']] },
  { c: 3, title: 'Une cada autor o pasaje con su enseñanza', pairs: [['Gothard y LaHaye', 'Modelo de autoridad jerárquico'], ['Gordon y Ginott', 'Modelo de autoridad democrático'], ['Seamonds', 'La sanidad de los recuerdos'], ['1 Pedro 3:3-4', 'El adorno interno y no el externo']] },
  { c: 4, title: 'Une cada término con su significado', pairs: [['Comisión de Púlpito', 'Estudia al pastor candidato'], ['Antecesor', 'No debe regresar a hacer bodas ni funerales'], ['W. O. Vaught', 'Predicó versículo tras versículo'], ['Fondo de ayuda', 'Sirve para ayudar a miembros con necesidad']] },
  { c: 5, title: 'Une cada pregunta o persona con su sentido', pairs: [['¿Quién soy?', 'Su identidad como hijo de Dios'], ['¿Cuál es mi evangelio?', 'Lo que cree de las doctrinas'], ['¿Quién es mi pueblo?', 'Su denominación'], ['H. Harvey', 'Los votos de ordenación se hacen a Dios']] },
  { c: 6, title: 'Une cada tema con lo que dice el libro', pairs: [['Campañas unidas', 'Esfera de cooperación'], ['Instituciones de educación', 'Esfera de no colaboración'], ['Movimiento ecuménico', 'Optó por un evangelio social'], ['Sociedad Bíblica', 'Campañas de distribución de la Biblia']] },
  { c: 7, title: 'Une cada idea con su ejemplo', pairs: [['Informarse bien', 'Como el médico antes de operar'], ['Dialogar ampliamente', 'En la multitud de consejeros hay seguridad'], ['Orar diligentemente', 'Ezequías ante Senaquerib'], ['Vender la primogenitura por un guisado', 'Aliarse con grupos de bases ateas']] }
];

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* Conexión con Firebase (estos datos identifican el proyecto, no son secretos) */
const fbApp = initializeApp({
  apiKey: 'AIzaSyBVpJHDmpME3Xr4_A02atv7LZjaH14wPgw',
  authDomain: 'etica-pastoral.firebaseapp.com',
  projectId: 'etica-pastoral',
  storageBucket: 'etica-pastoral.firebasestorage.app',
  messagingSenderId: '10882627686',
  appId: '1:10882627686:web:ad6077310c826296c655a7'
});
const auth = getAuth(fbApp);
const fdb = getFirestore(fbApp);
const DOMINIO = '@etica-pastoral.app';

(() => {
'use strict';

/* ---------- Utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const RM = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const lab2 = (a, b) => `<span class="lab2"><span>${esc(a)}</span><span>${esc(b)}</span></span>`;
const LETRAS = ['A', 'B', 'C', 'D', 'E'];
const esNum = id => /^\d/.test(id);

/* ---------- Progreso guardado en la nube (Firebase) ---------- */
const SES = { uid: null, nombre: '', usuario: '', esProfe: false };
const P = { leidos: {}, sims: [] };
let guardarT = null;
function save() {
  if (!SES.uid) return;
  clearTimeout(guardarT);
  guardarT = setTimeout(guardarAhora, 700);
}
async function guardarAhora() {
  if (!SES.uid) return;
  try {
    await setDoc(doc(fdb, 'usuarios', SES.uid), {
      nombre: SES.nombre, usuario: SES.usuario,
      leidos: Object.keys(P.leidos), sims: P.sims.slice(0, 60),
      actualizado: serverTimestamp()
    }, { merge: true });
  } catch (e) { toast('No se pudo guardar, revisa tu conexión a internet'); }
}
window.addEventListener('pagehide', () => { if (guardarT) { clearTimeout(guardarT); guardarAhora(); } });
const clave = (n, id) => n + '|' + id;
const leido = (n, id) => !!P.leidos[clave(n, id)];
const leidosCap = c => c.subs.filter(s => leido(c.n, s.id)).length;
const pctCap = c => Math.round(leidosCap(c) / c.subs.length * 100);
const TOTAL_SUBS = CAPS.reduce((a, c) => a + c.subs.length, 0);

/* ---------- Texto con formato simple ---------- */
function inline(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*(?=\S)(.+?)\*(?!\w)/g, '$1<em>$2</em>');
}
function blocks(src) {
  let html = '', list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  src.split('\n').forEach(raw => {
    const line = raw.trim(); if (!line) return;
    const ul = line.match(/^-\s+(.*)$/), ol = line.match(/^\d+\.\s+(.*)$/);
    if (ul || ol) {
      const tag = ul ? 'ul' : 'ol';
      if (list !== tag) { close(); html += `<${tag}>`; list = tag; }
      html += `<li>${inline((ul || ol)[1])}</li>`;
    } else { close(); html += `<p>${inline(line)}</p>`; }
  });
  close();
  return html;
}

/* ---------- Navegación ---------- */
const view = $('#view');
const state = { route: 'inicio', tab: {}, nodo: 1, progTab: 'general', simSel: 'todos', sim: null, hoja: null };
const ROUTES = /^(inicio|capitulos|simulacro|progreso|panel|cap-[1-7])$/;
function go(route) {
  if (!ROUTES.test(route)) route = 'inicio';
  cerrarHoja(true);
  state.route = route;
  render();
  window.scrollTo(0, 0);
  try { if (location.hash.slice(1) !== route) location.hash = route; } catch (e) { /* sin hash */ }
}
window.addEventListener('hashchange', () => {
  const r = (location.hash || '').slice(1) || 'inicio';
  if (r !== state.route && ROUTES.test(r)) { cerrarHoja(true); state.route = r; render(); window.scrollTo(0, 0); }
});
function render() {
  const r = state.route, m = r.match(/^cap-([1-7])$/);
  if (m) renderCap(+m[1]);
  else if (r === 'capitulos') renderCapitulos();
  else if (r === 'simulacro') renderSim();
  else if (r === 'progreso') renderProgreso();
  else if (r === 'panel') renderPanel();
  else renderInicio();
  $$('[data-nav]').forEach(b => {
    const on = b.dataset.nav === r || (b.dataset.nav === 'capitulos' && !!m);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
}

/* ---------- Inicio: la línea de los 7 capítulos ---------- */
function panelResumen(n) {
  const c = CAPS[n - 1], r = c.resumen;
  return `<span class="label">Capítulo ${n} · ${esc(c.ring)}</span>
    <h2 class="h2">${esc(c.title)}</h2>
    <p class="jp-idea">${inline(r.idea)}</p>
    <div class="row">
      <a class="btn btn-primary" href="#cap-${n}" data-go="cap-${n}">Leer el capítulo ${n}</a>
      ${n < 7 ? `<button class="btn" type="button" data-act="nodo" data-k="${n + 1}">Siguiente: ${esc(CAPS[n].ring)} →</button>` : ''}
    </div>`;
}
function lineaHTML() {
  const sel = state.nodo;
  return `<div class="track" role="tablist" aria-label="Capítulos del libro">
    <span class="line" aria-hidden="true"><i style="width:${((sel - 1) / 6) * 100}%"></i></span>
    ${CAPS.map(c => `<button class="node${c.n === sel ? ' on' : ''}${c.n < sel ? ' past' : ''}" type="button" role="tab" aria-selected="${c.n === sel}" aria-controls="jpanel" data-act="nodo" data-k="${c.n}" style="--s:${28 + c.n * 3}px;--cc:var(--c${c.n})">
      <span class="dotwrap"><span class="dot">${c.n}</span></span><span class="nm">${esc(c.ring).replace('Denominación', 'Denomi&shy;nación')}</span></button>`).join('')}
  </div>`;
}
function renderInicio() {
  view.innerHTML = `
  <section class="home">
    <div class="hero-txt">
      <h1 class="h-display titulo" id="titulo" aria-label="Ética Pastoral">${letras('Ética Pastoral')}</h1>
      <p class="sub">De pastor a pastor</p>
      <p class="hola">Hola, ${esc(SES.nombre.split(' ')[0] || SES.usuario)}</p>
      <p class="lead">Un libro sobre cómo debe vivir el ministro de Dios, empieza en la Biblia, sigue con su persona, su familia, su iglesia y su denominación, y termina en la comunidad, como círculos que se abren del centro hacia afuera</p>
      <div class="row"><a class="btn btn-primary btn-big" href="#capitulos" data-go="capitulos">Empezar a estudiar</a></div>
    </div>
    <div class="journey">
      <p class="label">Del centro hacia afuera</p>
      <div id="linea">${lineaHTML()}</div>
      <div class="jpanel card" id="jpanel" role="tabpanel" aria-live="polite">${panelResumen(state.nodo)}</div>
    </div>
  </section>`;
  animarTitulo();
}
/* Título con letras que reaccionan al mouse o al dedo */
function letras(t) {
  let k = 0;
  return t.split(' ').map(p => `<span class="palabra" aria-hidden="true">${[...p].map(ch => `<span class="letra" style="--i:${k++}">${esc(ch)}</span>`).join('')}</span>`).join(' ');
}
function animarTitulo() {
  const h = $('#titulo'); if (!h || RM()) return;
  const ls = $$('.letra', h);
  let raf = 0, px = 0, py = 0, base = null;
  const medir = () => {
    const hr = h.getBoundingClientRect();
    base = ls.map(l => { const t = l.style.transform; l.style.transform = ''; const r = l.getBoundingClientRect(); l.style.transform = t; return [r.left + r.width / 2 - hr.left, r.top + r.height / 2 - hr.top]; });
  };
  window.addEventListener('resize', () => { base = null; });
  const mover = () => {
    raf = 0;
    if (!document.body.contains(h)) return;
    if (!base) medir();
    const hr = h.getBoundingClientRect();
    ls.forEach((l, i) => {
      const dx = px - (hr.left + base[i][0]), dy = py - (hr.top + base[i][1]);
      const f = Math.max(0, 1 - Math.hypot(dx, dy * 1.4) / 170);
      l.style.transform = f ? `translateY(${(-f * 18).toFixed(1)}px) rotate(${(dx / 40 * f).toFixed(1)}deg) scale(${(1 + f * .14).toFixed(3)})` : '';
      l.classList.toggle('cerca', f > .45);
    });
  };
  const seguir = (x, y) => { px = x; py = y; if (!raf) raf = requestAnimationFrame(mover); };
  const soltar = () => { if (raf) cancelAnimationFrame(raf); raf = 0; ls.forEach(l => { l.style.transform = ''; l.classList.remove('cerca'); }); };
  const zona = h.parentElement;
  zona.addEventListener('pointermove', e => seguir(e.clientX, e.clientY));
  zona.addEventListener('pointerleave', soltar);
  h.addEventListener('touchmove', e => { const t = e.touches[0]; if (t) seguir(t.clientX, t.clientY); }, { passive: true });
  h.addEventListener('touchend', soltar);
}
function elegirNodo(n) {
  state.nodo = n;
  $('#linea').innerHTML = lineaHTML();
  const p = $('#jpanel');
  p.classList.remove('swap'); void p.offsetWidth; p.classList.add('swap');
  p.innerHTML = panelResumen(n);
  const r = p.getBoundingClientRect();
  if (r.top < 70 || r.top > innerHeight * .6) $('#linea').scrollIntoView({ block: 'start', behavior: RM() ? 'auto' : 'smooth' });
  const b = $(`.node[data-k="${n}"]`); if (b) b.focus({ preventScroll: true });
}

/* ---------- Capítulos ---------- */
function renderCapitulos() {
  view.innerHTML = `
  <div class="narrow col">
    <h1 class="h1 centro">Capítulos</h1>
    <div class="caplist">${CAPS.map(c => { const p = pctCap(c); return `
      <a class="capitem" href="#cap-${c.n}" data-go="cap-${c.n}">
        <span class="badge" style="background:var(--c${c.n})">${c.n}</span>
        <span class="t"><b>${esc(c.title)}</b>
          <span class="mini"><span class="bar"><i style="width:${p}%"></i></span><span class="small muted">${p === 100 ? '✓ Leído completo' : p + '% leído'}</span></span></span>
      </a>`; }).join('')}</div>
  </div>`;
}

/* ---------- Un capítulo ---------- */
function renderCap(n) {
  const c = CAPS[n - 1], tab = state.tab[n] || 'capitulo';
  view.innerHTML = `
  <div class="narrow col">
    <a class="btn btn-sm back" href="#capitulos" data-go="capitulos">← Capítulos</a>
    <div class="col centro" style="gap:8px"><span class="label">Capítulo ${n}</span><h1 class="h1">${esc(c.title)}</h1></div>
    <div class="tabs centrado" role="tablist" aria-label="Partes del capítulo">
      <button class="btn" type="button" role="tab" aria-selected="${tab === 'capitulo'}" data-act="tab" data-k="capitulo">Capítulo</button>
      <button class="btn" type="button" role="tab" aria-selected="${tab === 'resumen'}" data-act="tab" data-k="resumen">Resumen</button>
    </div>
    <div id="panel" role="tabpanel" class="col">${tab === 'capitulo' ? listaHTML(c) : resumenHTML(c)}</div>
    ${finalHTML(c)}
  </div>`;
}
function listaHTML(c) {
  const l = leidosCap(c), p = pctCap(c);
  return `
    <div class="card col" style="gap:10px">
      <div class="row-between"><span class="label">Tu lectura</span><strong>${l} de ${c.subs.length} subtítulos · ${p}%</strong></div>
      <div class="bar"><i style="width:${p}%"></i></div>
      <p class="muted small">Toca un subtítulo para abrirlo. Al terminar de leerlo, márcalo como leído.</p>
    </div>
    <div class="sublist">${c.subs.map((s, i) => { const ok = leido(c.n, s.id); return `
      <button class="subitem${ok ? ' read' : ''}" type="button" data-act="abrir" data-k="${i}">
        <span class="n">${esNum(s.id) ? esc(s.id) : ''}</span>
        <span class="tt">${esc(s.t)}</span>
        <span class="chk" aria-label="${ok ? 'Leído' : 'Sin leer'}">${ok ? '✓' : ''}</span>
      </button>`; }).join('')}</div>`;
}
function resumenHTML(c) {
  const r = c.resumen;
  return `
    <div class="card card-strong col" style="gap:10px"><span class="label">Idea central</span><p class="idea">${inline(r.idea)}</p></div>
    <div class="card col" style="gap:12px"><span class="label">Lo principal</span><ul class="points">${r.puntos.map(p => `<li>${inline(p)}</li>`).join('')}</ul></div>
    <div class="card recuerda col" style="gap:8px"><span class="label">Para recordar</span><p>${inline(r.recuerda)}</p></div>`;
}
function finalHTML(c) {
  const n = c.n;
  return `
  <div class="card col" style="gap:14px">
    <div class="row"><button class="btn" type="button" data-act="practicar" data-k="${n}">Practicar este capítulo</button></div>
    <div class="row-between">
      ${n > 1 ? `<a class="btn btn-sm" href="#cap-${n - 1}" data-go="cap-${n - 1}">← Capítulo ${n - 1}</a>` : '<span></span>'}
      ${n < 7 ? `<a class="btn btn-sm" href="#cap-${n + 1}" data-go="cap-${n + 1}">Capítulo ${n + 1} →</a>` : `<a class="btn btn-sm" href="#simulacro" data-go="simulacro">Ir al simulacro →</a>`}
    </div>
  </div>`;
}

/* ---------- Bloque de subtítulo en el centro ---------- */
const hoja = $('#sheet');
let ultimoFoco = null;
function abrirHoja(n, i) {
  const primera = !state.hoja;
  state.hoja = { n, i };
  if (primera) {
    ultimoFoco = document.activeElement;
    hoja.hidden = false; document.body.classList.add('no-scroll');
    try { history.pushState({ hoja: 1 }, ''); } catch (e) { /* sin historial */ }
  }
  dibujarHoja();
  $('#sheetClose').focus({ preventScroll: true });
}
function dibujarHoja() {
  const { n, i } = state.hoja, c = CAPS[n - 1], s = c.subs[i], ok = leido(n, s.id);
  $('#sheetNum').textContent = esNum(s.id) ? `${s.id} · Capítulo ${n}` : `Capítulo ${n}`;
  $('#sheetTitle').textContent = s.t;
  $('#sheetPos').textContent = `${i + 1} de ${c.subs.length}`;
  const body = $('#sheetBody');
  body.innerHTML = `<div class="prose">${blocks(s.b)}</div>`;
  body.scrollTop = 0;
  const lb = $('#sheetRead');
  lb.textContent = ok ? '✓ Leído' : 'Marcar como leído';
  lb.setAttribute('aria-pressed', ok);
  lb.classList.toggle('btn-primary', !ok);
  $('#sheetPrev').disabled = i === 0;
  $('#sheetNext').disabled = i === c.subs.length - 1;
}
function cerrarHoja(sinHistorial) {
  if (!state.hoja) return;
  const n = state.hoja.n;
  state.hoja = null; hoja.hidden = true; document.body.classList.remove('no-scroll');
  if (!sinHistorial) { try { if (history.state && history.state.hoja) history.back(); } catch (e) { /* sin historial */ } }
  if (state.route === 'cap-' + n) {
    const y = window.scrollY; renderCap(n); window.scrollTo(0, y);
    if (ultimoFoco && ultimoFoco.dataset && ultimoFoco.dataset.k != null) { const b = $(`.subitem[data-k="${ultimoFoco.dataset.k}"]`); if (b) b.focus({ preventScroll: true }); }
  }
}
window.addEventListener('popstate', () => { if (state.hoja) cerrarHoja(true); });
function marcarLeido() {
  const { n, i } = state.hoja, c = CAPS[n - 1], s = c.subs[i], k = clave(n, s.id);
  if (P.leidos[k]) delete P.leidos[k]; else P.leidos[k] = Date.now();
  save('leidos');
  dibujarHoja();
  if (P.leidos[k]) toast(pctCap(c) === 100 ? `¡Terminaste el capítulo ${n}!` : `Leído · capítulo ${n} al ${pctCap(c)}%`);
}

/* ---------- Simulacro ---------- */
function armarSimulacro(sel) {
  const qs = [];
  if (sel === 'todos') {
    CAPS.forEach(c => shuffle(PREGUNTAS.filter(q => q.c === c.n)).slice(0, 3).forEach(q => qs.push({ tipo: 'opcion', ...q })));
    const ps = shuffle(PAREOS).slice(0, 2).map(p => ({ tipo: 'pareo', ...p }));
    return [...shuffle(qs), ...ps];
  }
  const n = +sel;
  return [...shuffle(PREGUNTAS.filter(q => q.c === n)).map(q => ({ tipo: 'opcion', ...q })), ...PAREOS.filter(p => p.c === n).map(p => ({ tipo: 'pareo', ...p }))];
}
function contar(sel) {
  const qs = armarSimulacro(sel);
  const preg = qs.filter(q => q.tipo === 'opcion').length, par = qs.filter(q => q.tipo === 'pareo').length;
  return `${preg} preguntas y ${par} ${par === 1 ? 'pareo' : 'pareos'}`;
}
const selNombre = sel => sel === 'todos' ? 'Todos los capítulos' : 'Capítulo ' + sel;
function renderSim() {
  if (state.sim) return dibujarPregunta();
  const sel = state.simSel;
  view.innerHTML = `
  <div class="narrow col">
    <div class="col centro" style="gap:10px"><h1 class="h1">Simulacro</h1><p class="lead">Preguntas sacadas del libro, con su respuesta, y algunos pareos. Elige qué quieres practicar.</p></div>
    <div class="card col centro" style="gap:16px">
      <span class="label">¿Qué quieres practicar?</span>
      <div class="choices" role="group" aria-label="Capítulos">
        <button class="btn" type="button" data-act="sel" data-k="todos" aria-pressed="${sel === 'todos'}">Todos los capítulos</button>
        ${CAPS.map(c => `<button class="btn" type="button" data-act="sel" data-k="${c.n}" aria-pressed="${sel === String(c.n)}">Capítulo ${c.n}</button>`).join('')}
      </div>
      <p class="muted">${esc(selNombre(sel))}: ${contar(sel)}.</p>
      <button class="btn btn-primary btn-big" type="button" data-act="empezar">Empezar</button>
    </div>
  </div>`;
}
function empezarSim() {
  state.sim = { sel: state.simSel, qs: armarSimulacro(state.simSel), i: 0, resp: [] };
  state.sim.qs.forEach(q => {
    if (q.tipo === 'opcion') q.ops = shuffle(q.o.map((t, k) => ({ t, ok: k === 0 })));
    else q.der = shuffle(q.pairs.map(p => p[1]));
  });
  dibujarPregunta(); window.scrollTo(0, 0);
}
function puntos(sim) {
  let ok = 0, tot = 0;
  sim.qs.forEach((q, k) => {
    const r = sim.resp[k];
    if (q.tipo === 'opcion') { tot++; if (r && r.ok) ok++; }
    else { tot += q.pairs.length; if (r) ok += r.aciertos; }
  });
  return { ok, tot, pct: tot ? Math.round(ok / tot * 100) : 0 };
}
function dibujarPregunta() {
  const s = state.sim;
  if (s.i >= s.qs.length) return dibujarResultado();
  const q = s.qs[s.i], r = s.resp[s.i];
  const cab = `<div class="qhead"><span>Pregunta ${s.i + 1} de ${s.qs.length}</span><span class="tag">Capítulo ${q.c}</span>${q.tipo === 'pareo' ? '<span class="tag">Pareo</span>' : ''}</div><div class="bar"><i style="width:${Math.round(s.i / s.qs.length * 100)}%"></i></div>`;
  let cuerpo = '';
  if (q.tipo === 'opcion') {
    cuerpo = `<h2 class="qtext">${esc(q.q)}</h2>
      <div class="opts">${q.ops.map((o, k) => {
        const cls = r ? (o.ok ? ' right' : (r.pick === k ? ' wrong' : ' dim')) : '';
        return `<button class="opt${cls}" type="button" data-act="elegir" data-k="${k}"${r ? ' disabled' : ''}><span class="k">${LETRAS[k]}</span><span>${esc(o.t)}</span></button>`;
      }).join('')}</div>`;
    if (r) {
      const bien = q.ops.find(o => o.ok).t;
      cuerpo += `<div class="fb ${r.ok ? 'ok' : 'bad'}" role="status"><span class="t">${r.ok ? '¡Correcto!' : 'Incorrecto'}</span>${r.ok ? '' : `<p>La respuesta es: <strong>${esc(bien)}</strong></p>`}${q.e ? `<p class="muted">${esc(q.e)}</p>` : ''}</div>`;
    }
  } else {
    cuerpo = `<h2 class="qtext">${esc(q.title)}</h2><p class="muted">Elige la respuesta correcta para cada uno.</p>
      <div class="pareo">${q.pairs.map((p, k) => {
        const elegido = r ? r.sel[k] : (s.borrador && s.borrador[k]) || '';

          <select id="p${k}" data-k="${k}"${r ? ' disabled' : ''}><option value="">Elige…</option>${q.der.map(d => `<option value="${esc(d)}"${d === elegido ? ' selected' : ''}>${esc(d)}</option>`).join('')}</select>
          ${r && elegido !== p[1] ? `<span class="ans">Correcto: <strong>${esc(p[1])}</strong></span>` : ''}</div>`;
      }).join('')}</div>`;
    if (!r) cuerpo += `<button class="btn btn-primary btn-big" type="button" data-act="revisar">Revisar pareo</button>`;
    else cuerpo += `<div class="fb ${r.aciertos === q.pairs.length ? 'ok' : 'bad'}" role="status"><span class="t">${r.aciertos} de ${q.pairs.length} correctas</span></div>`;
  }
  if (r) cuerpo += `<button class="btn btn-primary btn-big" type="button" data-act="siguiente">${s.i < s.qs.length - 1 ? 'Siguiente' : 'Ver mi resultado'}</button>`;
  view.innerHTML = `<div class="narrow quiz">
    <div class="row-between"><span class="label">${esc(selNombre(s.sel))}</span><button class="btn btn-sm" type="button" data-act="salir">Salir</button></div>
    ${cab}${cuerpo}</div>`;
  const fb = $('.fb', view);
  if (fb) { const b = fb.getBoundingClientRect(); if (b.bottom > innerHeight - 90) fb.scrollIntoView({ block: 'center', behavior: RM() ? 'auto' : 'smooth' }); }
}
function dibujarResultado() {
  const s = state.sim, p = puntos(s);

  const msg = p.pct >= 90 ? '¡Excelente! Dominas el tema.' : p.pct >= 70 ? 'Muy bien. Repasa las que fallaste.' : p.pct >= 50 ? 'Vas bien. Vuelve a leer los capítulos donde fallaste.' : 'Conviene repasar los capítulos antes de intentarlo otra vez.';

  }).join('');

/* ---------- Progreso ---------- */
function statsSim(sel) {
  const l = P.sims.filter(x => String(x.sel) === String(sel));
  return { n: l.length, mejor: l.length ? Math.max(...l.map(x => x.pct)) : null, ultimo: l.length ? l[0].pct : null };
}
function renderProgreso() {

  view.innerHTML = `
  <div class="narrow col">
    <div class="col centro" style="gap:10px"><h1 class="h1">Mi progreso</h1><p class="lead">Aquí se guardan todas tus estadísticas</p><p class="muted small">Conectado como <strong>${esc(SES.nombre)}</strong> · @${esc(SES.usuario)}</p><button class="btn btn-sm" type="button" data-act="salir">Cerrar sesión</button></div>
    <div class="tabs centrado prog-tabs" role="tablist" aria-label="Partes del progreso">
      ${tabs.map(([k, l]) => `<button class="btn" type="button" role="tab" aria-selected="${k === tab}" data-act="progtab" data-k="${k}">${l}</button>`).join('')}
    </div>
    <div id="progPanel" role="tabpanel" class="col">${progPanel(tab)}</div>
  </div>`;
}
function progPanel(tab) {
  const fecha = d => { try { return new Date(d).toLocaleDateString('es', { day: 'numeric', month: 'short' }); } catch (e) { return ''; } };
  const tri = (a, b, c) => `<div class="cp-sims"><span><span class="muted small">${a[0]}</span><br><strong>${a[1]}</strong></span><span><span class="muted small">${b[0]}</span><br><strong>${b[1]}</strong></span><span><span class="muted small">${c[0]}</span><br><strong>${c[1]}</strong></span></div>`;
  const nota = v => v != null ? v + '%' : '—';
  if (tab === 'general') {
    const leidosTot = Object.keys(P.leidos).length;
    const pctTot = Math.round(leidosTot / TOTAL_SUBS * 100);
    const completos = CAPS.filter(c => pctCap(c) === 100).length;
    const conNota = P.sims.filter(x => x.tot);
    const correctas = conNota.reduce((a, x) => a + x.ok, 0), respondidas = conNota.reduce((a, x) => a + x.tot, 0);
    const promedio = P.sims.length ? Math.round(P.sims.reduce((a, x) => a + x.pct, 0) / P.sims.length) : null;
    const mejor = P.sims.length ? Math.max(...P.sims.map(x => x.pct)) : null;
    const stat = (lbl, val, sub) => `<div class="card stat"><span class="label">${lbl}</span><span class="big">${val}</span><span class="muted small">${sub}</span></div>`;
    return `<div class="stats">
      ${stat('Lectura total', pctTot + '%', `${leidosTot} de ${TOTAL_SUBS} subtítulos`)}
      ${stat('Capítulos completos', `${completos} / 7`, completos === 7 ? '¡Leíste todo el libro!' : 'Leídos al 100%')}
      ${stat('Simulacros hechos', P.sims.length, mejor != null ? `Mejor nota: ${mejor}%` : 'Todavía ninguno')}
      ${stat('Respuestas correctas', correctas, respondidas ? `de ${respondidas} · promedio ${promedio}%` : 'Aún sin responder')}
    </div>
    <div class="card col centro" style="gap:10px"><span class="label">Tu lectura del libro</span><div class="bar" style="width:100%"><i style="width:${pctTot}%"></i></div><p class="muted small">${pctTot === 100 ? 'Leíste todos los subtítulos' : 'Sigue marcando los subtítulos que lees para ver tu avance'}</p></div>`;
  }
  if (tab === 'capitulos') {
    return `<div class="caprog">${CAPS.map(c => { const p = pctCap(c), st = statsSim(c.n); return `
      <div class="card cp">
        <div class="cp-head"><span class="badge" style="background:var(--c${c.n})">${c.n}</span><b>${esc(c.title)}</b></div>
        <div class="cp-row"><span class="muted small">Lectura</span><div class="bar"><i style="width:${p}%"></i></div><strong>${p}%</strong></div>
        <p class="small muted">${leidosCap(c)} de ${c.subs.length} subtítulos leídos</p>
        ${tri(['Simulacros', st.n], ['Nota más alta', nota(st.mejor)], ['Último', nota(st.ultimo)])}
        <div class="row"><a class="btn btn-sm" href="#cap-${c.n}" data-go="cap-${c.n}">${p === 100 ? 'Repasar' : 'Seguir leyendo'}</a><button class="btn btn-sm" type="button" data-act="practicar" data-k="${c.n}">Practicar</button></div>
      </div>`; }).join('')}</div>`;
  }
  if (tab === 'simulacros') {
    const todos = statsSim('todos');
    return `<div class="card col centro" style="gap:14px">
        <span class="label">Simulacro de todos los capítulos</span>
        ${tri(['Hechos', todos.n], ['Nota más alta', nota(todos.mejor)], ['Último', nota(todos.ultimo)])}
        <button class="btn btn-primary" type="button" data-act="practicar" data-k="todos">Hacer simulacro completo</button>
      </div>
      <div class="card col" style="gap:12px">
        <span class="label centro">Últimos simulacros</span>
        ${P.sims.length ? P.sims.slice(0, 10).map(x => `<div class="hist"><span class="muted">${fecha(x.d)}</span><span>${esc(selNombre(x.sel))}${x.tot ? ` <span class="muted small">· ${x.ok} de ${x.tot}</span>` : ''}<div class="bar" style="margin-top:6px"><i style="width:${x.pct}%"></i></div></span><strong>${x.pct}%</strong></div>`).join('') : '<p class="muted centro">Todavía no has hecho ningún simulacro</p>'}
      </div>`;
  }
  return `<div class="card col centro" style="gap:16px;padding:30px 24px">
      <span class="label">Iniciar de nuevo</span>
      <p class="lead">Vas a empezar desde cero, se borran los subtítulos que marcaste como leídos y los resultados de todos tus simulacros</p>
      <div class="row" id="resetBox" style="justify-content:center"><button class="btn" type="button" data-act="reset">Borrar mi progreso</button></div>
    </div>`;
}

const MSG = {

async function enviarLogin(e) {
  e.preventDefault();
  const crear = state.login === 'crear';
  const err = $('#loginError'), btn = $('#loginBtn');
  const mostrar = m => { err.textContent = m; err.hidden = false; };
  err.hidden = true;
  const usuario = limpiarUsuario($('#fUsuario').value), clave = $('#fClave').value;
  if (!usuarioValido(usuario)) return mostrar('Escribe un usuario de 3 a 30 caracteres, sin espacios ni tildes');
  if (clave.length < 6) return mostrar('La contraseña debe tener al menos 6 caracteres');
  let nombre = '';
  if (crear) {
    nombre = $('#fNombre').value.trim().replace(/\s+/g, ' ');
    if (nombre.length < 3) return mostrar('Escribe tu nombre completo');
    if (clave !== $('#fClave2').value) return mostrar('Las contraseñas no coinciden');
  }
  btn.disabled = true; btn.textContent = crear ? 'Creando tu cuenta…' : 'Entrando…';
  try {
    if (crear) {
      state.nuevo = { nombre, usuario };
      const cred = await createUserWithEmailAndPassword(auth, usuario + DOMINIO, clave);
      await setDoc(doc(fdb, 'usuarios', cred.user.uid), { nombre, usuario, leidos: [], sims: [], creado: serverTimestamp(), actualizado: serverTimestamp() });
    } else {
      await signInWithEmailAndPassword(auth, usuario + DOMINIO, clave);
    }
  } catch (ex) {
    state.nuevo = null;
    mostrar(MSG[ex.code] || 'No se pudo completar, inténtalo de nuevo');
    btn.disabled = false; btn.textContent = crear ? 'Crear mi cuenta' : 'Entrar';
  }
}
async function cargarSesion(user) {

function datosAlumno(a) {

  const ts = a.actualizado && a.actualizado.toDate ? a.actualizado.toDate() : null;
  return {
    lectura: Math.round(leidos.size / TOTAL_SUBS * 100), caps, completos: caps.filter(p => p === 100).length,
    nSims: sims.length, mejor: sims.length ? Math.max(...sims.map(x => x.pct)) : null,
    prom: sims.length ? Math.round(sims.reduce((s, x) => s + x.pct, 0) / sims.length) : null, ts

}

        <option value="nota"${orden === 'nota' ? ' selected' : ''}>Mejor nota</option>
        <option value="reciente"${orden === 'reciente' ? ' selected' : ''}>Actividad reciente</option>
        <option value="nombre"${orden === 'nombre' ? ' selected' : ''}>Nombre</option>

        <div class="al-det">

/* ---------- Avisos ---------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------- Clics ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-act]');
  if (!t) return;
  if (t.dataset.go) { e.preventDefault(); go(t.dataset.go); return; }
  const a = t.dataset.act, k = t.dataset.k, s = state.sim;
  switch (a) {
    case 'nodo': elegirNodo(+k); break;
    case 'login-modo': renderLogin(k); break;
    case 'salir': salir(); break;
    case 'panel-recargar': renderPanel(); break;
    case 'tab': { const n = +state.route.slice(4); state.tab[n] = k; renderCap(n); const tb = $(`[data-act="tab"][data-k="${k}"]`); if (tb) tb.focus({ preventScroll: true }); break; }
    case 'abrir': abrirHoja(+state.route.slice(4), +k); break;
    case 'cerrar': cerrarHoja(); break;
    case 'anterior': if (state.hoja && state.hoja.i > 0) { state.hoja.i--; dibujarHoja(); } break;
    case 'proximo': if (state.hoja && state.hoja.i < CAPS[state.hoja.n - 1].subs.length - 1) { state.hoja.i++; dibujarHoja(); } break;
    case 'leido': marcarLeido(); break;
    case 'practicar': state.simSel = k; state.sim = null; go('simulacro'); break;
    case 'sel': state.simSel = k; renderSim(); break;
    case 'empezar': empezarSim(); break;
    case 'elegir': { const q = s.qs[s.i]; if (s.resp[s.i]) return; const pick = +k; s.resp[s.i] = { pick, ok: q.ops[pick].ok }; dibujarPregunta(); break; }
    case 'revisar': {
      const q = s.qs[s.i], sel = $$('.prow select', view).map(x => x.value);
      if (sel.some(v => !v)) { toast('Elige una respuesta en cada fila'); return; }
      s.resp[s.i] = { sel, aciertos: q.pairs.filter((p, j) => sel[j] === p[1]).length }; s.borrador = null; dibujarPregunta();
      break;
    }
    case 'siguiente': s.i++; s.borrador = null; dibujarPregunta(); window.scrollTo(0, 0); break;
    case 'salir': state.sim = null; renderSim(); break;
    case 'otro': state.sim = null; renderSim(); window.scrollTo(0, 0); break;
    case 'progtab': state.progTab = k; renderProgreso(); { const tb = $(`[data-act="progtab"][data-k="${k}"]`); if (tb) tb.focus({ preventScroll: true }); } break;
    case 'reset': $('#resetBox').innerHTML = '<span class="small" style="width:100%">¿Seguro? Esto no se puede deshacer</span><button class="btn btn-primary" type="button" data-act="reset-si">Sí, borrar todo</button><button class="btn" type="button" data-act="reset-no">Cancelar</button>'; break;
    case 'reset-no': renderProgreso(); break;
    case 'reset-si': P.leidos = {}; P.sims = []; save('leidos'); save('sims'); state.progTab = 'general'; renderProgreso(); toast('Listo, empiezas desde cero'); break;
  }
});
document.addEventListener('change', e => {
  if (!e.target.matches('.prow select') || !state.sim) return;
  state.sim.borrador = $$('.prow select', view).map(x => x.value);
});
document.addEventListener('keydown', e => {
  if (!state.hoja) return;
  if (e.key === 'Escape') { e.preventDefault(); cerrarHoja(); }
  else if (e.key === 'Tab') {
    const f = $$('#sheet button:not([disabled]), #sheet [tabindex="0"]'); if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* Botón para subir */
const toTop = $('#toTop');
window.addEventListener('scroll', () => { toTop.hidden = window.scrollY < 700; }, { passive: true });
toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: RM() ? 'auto' : 'smooth' }));

/* ---------- Arranque ---------- */
document.documentElement.lang = 'es';
document.body.classList.add('sin-sesion');
view.innerHTML = '<p class="muted centro" style="padding:80px 0">Cargando…</p>';
onAuthStateChanged(auth, user => {
  if (user) cargarSesion(user);
  else { SES.uid = null; SES.esProfe = false; P.leidos = {}; P.sims = []; state.sim = null; cerrarHoja(true); $$('.solo-profe').forEach(el => { el.hidden = true; }); renderLogin('entrar'); }
});
})();
</script>
</body>
</html>
