<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#051F20">
<title>Guía de Ética Pastoral</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Guía interactiva para preparar el examen de Ética Pastoral (De pastor a pastor, capítulos 1 al 7).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: una columna centrada, cuatro secciones (Inicio, Capítulos, Simulacro, Progreso).
   Menú arriba en computadora y abajo en celular. Un solo tema verde oscuro con texto siempre blanco. */
:root {
  color-scheme: dark;
  --bg: #051F20;
  --fg: #FFFFFF;
  --fg-2: rgba(255, 255, 255, .9);
  --fg-3: rgba(255, 255, 255, .76);
  --surface: rgba(11, 43, 38, .62);
  --surface-2: rgba(22, 56, 50, .88);
  --line: rgba(218, 241, 222, .16);
  --line-2: rgba(218, 241, 222, .3);
  --green: #288760;
  --green-hi: #33A374;
  --mint: #B7E5BA;
  --glow: rgba(92, 168, 124, .35);
  --ok: #7FE0A6;
  --ok-bg: rgba(127, 224, 166, .14);
  --bad: #FF9E85;
  --bad-bg: rgba(255, 158, 133, .14);
  --topbar: rgba(5, 31, 32, .82);
  --f-display: "Inter Tight", "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r-lg: 22px; --r-md: 16px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  /* Anillos del diagrama: del centro (más claro) hacia afuera (más oscuro). Todos llevan texto blanco. */
  --c1: #2A8A66; --c2: #247B5C; --c3: #1F6C51; --c4: #1A5E47; --c5: #16513E; --c6: #124536; --c7: #0F3A2F;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 17px/1.65 var(--f-body); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button, select { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; border-radius: 8px; }

/* Fondo: manchas verdes, haz de luz, cuadrícula y grano */
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: var(--bg); }
.blob { position: absolute; border-radius: 50%; filter: blur(80px); }
.b1 { width: 70vmax; height: 70vmax; left: -24vmax; top: -32vmax; background: radial-gradient(circle, #5CA87C 0%, transparent 62%); opacity: .45; animation: d1 40s ease-in-out infinite alternate; }
.b2 { width: 64vmax; height: 64vmax; right: -26vmax; bottom: -28vmax; background: radial-gradient(circle, #288760 0%, transparent 64%); opacity: .6; animation: d2 46s ease-in-out infinite alternate; }
.b3 { width: 44vmax; height: 44vmax; right: 6vw; top: -12vmax; background: radial-gradient(circle, #12202A 0%, transparent 66%); opacity: .7; }
.beam { position: absolute; inset: -10%; background: radial-gradient(ellipse 48% 38% at 8% 0%, rgba(218, 241, 222, .14), transparent 70%); }
.gridlines { position: absolute; inset: 0; background-image: linear-gradient(rgba(218, 241, 222, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(218, 241, 222, .05) 1px, transparent 1px); background-size: 96px 96px; }
.grain { position: absolute; inset: 0; opacity: .1; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
@keyframes d1 { to { transform: translate(8vmax, 6vmax) scale(1.08); } }
@keyframes d2 { to { transform: translate(-7vmax, -5vmax) scale(1.1); } }

/* Estructura */
.app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--topbar); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; }
.topbar-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: inline-flex; flex-direction: column; font: 800 14px/1.1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; text-decoration: none; }
.brand span:last-child { color: var(--fg-3); }
.mainnav { display: flex; gap: 8px; }
main { flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 72px; }
.view { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.narrow { max-width: 780px; width: 100%; }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 12px 20px; border-radius: 999px; border: 1px solid var(--line-2);
  background: var(--surface-2); color: var(--fg); font: 600 16px/1.2 var(--f-body); text-decoration: none; cursor: pointer; text-align: center;
  transition: background-color .2s, border-color .2s, box-shadow .2s, transform .2s var(--ease); -webkit-tap-highlight-color: transparent; }
@media (hover: hover) { .btn:hover { background: var(--green); border-color: transparent; box-shadow: 0 0 0 4px var(--glow); transform: translateY(-2px); } }
.btn:active { transform: scale(.97); background: var(--green); }
.btn[aria-current="page"], .btn[aria-pressed="true"], .btn[aria-selected="true"] { background: var(--green); border-color: transparent; color: #FFFFFF; }
.btn-primary { background: var(--green); border-color: transparent; }
@media (hover: hover) { .btn-primary:hover { background: var(--green-hi); } }
.btn-big { min-height: 60px; padding: 16px 34px; font-size: 19px; }
.btn-sm { min-height: 40px; padding: 8px 16px; font-size: 15px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.row-between { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }

/* Textos */
.eyebrow { display: flex; gap: 28px; flex-wrap: wrap; }
.lab2 { display: inline-flex; flex-direction: column; font: 700 13px/1.2 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.lab2 span:last-child { color: var(--fg-3); }
.h-display { font: 800 clamp(56px, 9vw, 116px)/.95 var(--f-display); letter-spacing: -.045em; padding-top: .1em; margin-top: -.1em;
  background: linear-gradient(170deg, #FFFFFF 15%, #B7E5BA 95%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.h1 { font: 800 clamp(32px, 4.6vw, 52px)/1.04 var(--f-display); letter-spacing: -.035em; padding-top: .08em; }
.h2 { font: 750 clamp(22px, 2.6vw, 27px)/1.2 var(--f-display); letter-spacing: -.02em; }
.sub { font: 600 clamp(19px, 2.2vw, 23px)/1.3 var(--f-display); color: var(--fg-2); }
.lead { font-size: 18.5px; line-height: 1.6; color: var(--fg-2); max-width: 58ch; }
.muted { color: var(--fg-3); }
.small { font-size: 15px; }
.label { font: 700 13px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mint); }

/* Tarjetas */
.card { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 22px; min-width: 0; }
.card-strong { background: var(--surface-2); }

/* Inicio */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 40px; align-items: center; }
.hero-txt { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.circles { display: flex; flex-direction: column; align-items: center; gap: 18px; min-width: 0; }
.diagram { width: 100%; max-width: 300px; height: auto; aspect-ratio: 1; }
.diagram text { font-family: var(--f-mono); font-weight: 600; letter-spacing: .06em; fill: #FFFFFF; }
.legend { list-style: none; margin: 0; padding: 0; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 8px; }
.legend li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start; font-size: 15.5px; line-height: 1.45; }
.legend .num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--f-mono); color: #FFFFFF; border: 1px solid rgba(255, 255, 255, .25); }
.legend strong { font-weight: 700; }

/* Lista de capítulos */
.caplist { display: flex; flex-direction: column; gap: 12px; }
.capitem { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 18px; border-radius: var(--r-lg);
  border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--fg);
  transition: background-color .2s, border-color .2s, box-shadow .2s, transform .2s var(--ease); -webkit-tap-highlight-color: transparent; }
@media (hover: hover) { .capitem:hover { background: var(--green); border-color: transparent; box-shadow: 0 0 0 4px var(--glow); transform: translateY(-2px); } }
.capitem:active { background: var(--green); transform: scale(.99); }
.capitem .badge { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font: 800 20px/1 var(--f-display); color: #FFFFFF; border: 1px solid rgba(255, 255, 255, .28); }
.capitem .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.capitem .t b { font: 700 18px/1.3 var(--f-display); letter-spacing: -.01em; }
.capitem .st { font: 600 13px/1 var(--f-mono); padding: 7px 10px; border-radius: 999px; border: 1px solid var(--line-2); white-space: nowrap; }
.capitem .st.ok { background: rgba(255, 255, 255, .14); }
.arrow { font-size: 20px; }

/* Capítulo */
.back { align-self: flex-start; }
.tabs { display: flex; gap: 8px; padding: 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); width: fit-content; max-width: 100%; }
.tabs .btn { min-width: 130px; border-color: transparent; background: transparent; }
.tabs .btn[aria-selected="true"] { background: var(--green); }
.index { display: flex; flex-direction: column; gap: 4px; }
.index a { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; padding: 9px 12px; border-radius: 12px; text-decoration: none; font-size: 16px; line-height: 1.35; }
.index a:hover, .index a:focus-visible { background: rgba(255, 255, 255, .08); }
.index .n { font: 600 13.5px/1.6 var(--f-mono); color: var(--mint); }
.sec { scroll-margin-top: 90px; display: flex; flex-direction: column; gap: 12px; padding-top: 10px; }
.sec + .sec { border-top: 1px solid var(--line); padding-top: 28px; }
.sec .n { font: 600 14px/1 var(--f-mono); color: var(--mint); }
.prose { display: flex; flex-direction: column; gap: 12px; color: var(--fg-2); }
.prose strong { color: #FFFFFF; font-weight: 700; }
.prose ul, .prose ol { margin: 0; padding-left: 24px; display: flex; flex-direction: column; gap: 8px; }
.prose li::marker { color: var(--mint); }
.chapter-end { display: flex; flex-direction: column; gap: 14px; }
.idea { font: 700 clamp(20px, 2.4vw, 24px)/1.4 var(--f-display); letter-spacing: -.01em; }
.points { margin: 0; padding-left: 24px; display: flex; flex-direction: column; gap: 10px; color: var(--fg-2); }
.points li::marker { color: var(--mint); }
.recuerda { border-left: 4px solid var(--mint); }

/* Simulacro */
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.quiz { display: flex; flex-direction: column; gap: 18px; }
.qhead { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; color: var(--fg-3); font-size: 15px; }
.tag { font: 600 13px/1 var(--f-mono); padding: 7px 10px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--fg); }
.bar { height: 8px; border-radius: 999px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--green), var(--mint)); transition: width .4s var(--ease); }
.qtext { font: 700 clamp(21px, 2.6vw, 26px)/1.35 var(--f-display); letter-spacing: -.01em; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: flex-start; gap: 14px; width: 100%; min-height: 58px; padding: 14px 16px; border-radius: var(--r-md); border: 1px solid var(--line-2); background: var(--surface);
  text-align: left; font-size: 17px; line-height: 1.45; cursor: pointer; transition: background-color .2s, border-color .2s, box-shadow .2s; -webkit-tap-highlight-color: transparent; }
.opt .k { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 14px/1 var(--f-display); background: rgba(255, 255, 255, .12); }
@media (hover: hover) { .opt:not([disabled]):hover { background: var(--green); border-color: transparent; box-shadow: 0 0 0 4px var(--glow); } }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.right .k { background: var(--ok); color: #05301F; }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .k { background: var(--bad); color: #3A1206; }
.opt.dim { opacity: .55; }
.fb { border-radius: var(--r-md); padding: 16px 18px; border: 1px solid var(--line-2); background: var(--surface-2); display: flex; flex-direction: column; gap: 6px; }
.fb.ok { border-color: var(--ok); }
.fb.bad { border-color: var(--bad); }
.fb .t { font: 700 18px/1.3 var(--f-display); }
.fb.ok .t { color: var(--ok); }
.fb.bad .t { color: var(--bad); }
.pareo { display: flex; flex-direction: column; gap: 12px; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); }
.prow .l { font-weight: 700; }
.prow select { width: 100%; min-height: 50px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line-2); background: #0B2B26; color: #FFFFFF; font-size: 16px; }
.prow select:focus { outline: 3px solid var(--mint); outline-offset: 2px; }
.prow.right { border-color: var(--ok); background: var(--ok-bg); }
.prow.wrong { border-color: var(--bad); background: var(--bad-bg); }
.prow .ans { grid-column: 1 / -1; font-size: 15.5px; }
.score { font: 800 clamp(64px, 10vw, 96px)/1 var(--f-display); letter-spacing: -.04em; }
.review { display: flex; flex-direction: column; gap: 10px; }
.ritem { padding: 14px 16px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 4px; }
.ritem.bad { border-color: var(--bad); }
.ritem .mk { font: 700 13px/1 var(--f-mono); }
.ritem.ok .mk { color: var(--ok); }
.ritem.bad .mk { color: var(--bad); }

/* Progreso */
.plist { display: flex; flex-direction: column; gap: 10px; }
.prog-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); }
.hist { display: grid; grid-template-columns: 90px minmax(0, 1fr) 56px; gap: 12px; align-items: center; font-size: 15px; }

/* Menú inferior y botón subir */
.bottomnav { display: none; }
#toTop { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 35; min-height: 48px; box-shadow: 0 10px 24px -10px rgba(0, 0, 0, .6); }
#toast { position: fixed; z-index: 90; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  padding: 13px 20px; border-radius: 999px; background: var(--green); color: #FFFFFF; font-weight: 600; font-size: 16px; box-shadow: 0 12px 30px -12px rgba(0, 0, 0, .7);
  transition: opacity .25s, transform .25s var(--ease); max-width: calc(100vw - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 860px) {
  .hero { grid-template-columns: minmax(0, 1fr); gap: 32px; }
  .circles { align-items: stretch; }
  .diagram { align-self: center; max-width: 260px; }
  .legend { max-width: none; }
}
@media (max-width: 760px) {
  body { font-size: 17px; }
  .mainnav { display: none; }
  main { padding-top: 22px; padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
  .bottomnav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--topbar);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line);
    padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
  .bottomnav .btn { flex-direction: column; gap: 4px; min-height: 60px; padding: 6px 4px; border-radius: 16px; font-size: 13px; border-color: transparent; background: transparent; }
  .bottomnav .btn[aria-current="page"] { background: var(--green); }
  .bottomnav svg { width: 22px; height: 22px; }
  #toTop { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
  #toast { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .tabs { width: 100%; }
  .tabs .btn { flex: 1; min-width: 0; }
  .capitem { grid-template-columns: 44px minmax(0, 1fr); padding: 14px; gap: 14px; }
  .capitem .badge { width: 44px; height: 44px; font-size: 18px; }
  .capitem .end { grid-column: 2; justify-self: start; }
  .prow { grid-template-columns: minmax(0, 1fr); }
  .btn-big { width: 100%; }
  .card { padding: 18px; }
  .index a { grid-template-columns: 62px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
.stack { display: flex; flex-direction: column; gap: 10px; }
@media (max-width: 760px) { .capitem .arrow { display: none; } }

/* ===== Versión 3 ===== */
.col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
body.no-scroll { overflow: hidden; }

/* Inicio: texto y línea de capítulos con resumen */
.home { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 44px; align-items: start; }
.home .hero-txt { position: sticky; top: 110px; }
.journey { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
#linea { scroll-margin-top: 90px; }
.track { position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); align-items: start; padding: 4px 0; }
.track .line { position: absolute; left: calc(100% / 14); right: calc(100% / 14); top: 31px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .14); }
.track .line i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--mint), var(--green)); transition: width .45s var(--ease); }
.node { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 2px; background: none; border: 0; cursor: pointer; color: var(--fg); -webkit-tap-highlight-color: transparent; }
.node .dotwrap { height: 62px; display: grid; place-items: center; }
.node .dot { width: var(--s); height: var(--s); border-radius: 50%; display: grid; place-items: center; font: 800 16px/1 var(--f-display); background: var(--cc); border: 2px solid rgba(255, 255, 255, .28);
  box-shadow: 0 0 0 4px var(--bg); transition: transform .25s var(--ease), box-shadow .25s, border-color .25s; }
.node .nm { font: 600 13px/1.2 var(--f-body); color: var(--fg-3); text-align: center; transition: color .2s; }
@media (hover: hover) { .node:hover .dot { transform: scale(1.1); border-color: #FFFFFF; box-shadow: 0 0 0 4px var(--bg), 0 0 0 8px var(--glow); } .node:hover .nm { color: #FFFFFF; } }
.node.past .dot { border-color: var(--mint); }
.node.on .dot { background: var(--green); border-color: #FFFFFF; transform: scale(1.15); box-shadow: 0 0 0 4px var(--bg), 0 0 0 9px var(--glow), 0 0 28px 4px rgba(92, 168, 124, .45); }
.node.on .nm { color: #FFFFFF; font-weight: 800; }
.jpanel { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 26px; background: var(--surface-2); }
.jpanel > * { position: relative; }
.jpanel::before { content: ""; position: absolute; width: 760px; height: 760px; right: -380px; top: -380px; border-radius: 50%; pointer-events: none;
  background: repeating-radial-gradient(circle, transparent 0 34px, rgba(183, 229, 186, .07) 34px 36px); }
.jpanel.swap > * { animation: swapIn .4s var(--ease); }
@keyframes swapIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

<script>
/* Contenido de los 7 capítulos.
   Marcado del texto: línea normal = párrafo, "- " = viñeta, "1. " = lista numerada, **negrita**, *cursiva* */
const CAPS = [
{
  n: 1, title: 'Resumen bíblico de los requisitos morales de los líderes espirituales', ring: 'Biblia', frase: 'El centro. La regla con la que se mide todo lo demás.',
  resumen: {
    idea: 'La Biblia es la base de las normas éticas del ministro. En cada época, desde los patriarcas hasta el Apocalipsis, Dios pidió a sus líderes una vida moral alta.',
    puntos: [
      'El ministro debe haber nacido de nuevo, tener sed por las almas y mantener una vida devocional constante.',
      'Los patriarcas no fueron perfectos, pero se arrepentían y guiaban a su familia de vuelta a Dios.',
      'Moisés llevaba sus cargas a Dios y fue fiel a pesar de la oposición de su pueblo.',
      'Los sacerdotes tenían normas de vestido, familia, sobriedad y matrimonio que enseñan respeto y buen testimonio.',
      'Los profetas eran la conciencia moral del pueblo y debían vivir lo que predicaban.',
      'Para Jesús, la cualidad clave del líder es el amor a Dios y al prójimo.',
      'Pablo resume los requisitos de los pastores en 1 Timoteo 3:1-7 y Tito 1:5-9.',
      'Hebreos 13:7 enseña que la conducta del pastor respalda su mensaje.'
    ],
    recuerda: 'Este capítulo es el centro del libro. Los demás capítulos aplican estos requisitos a cada relación del ministro.'
  },
  subs: [
    { id: 'Intro', t: 'Introducción', b: `Cuando pensamos en normas éticas para ministros, lo natural es empezar por lo que enseña la Biblia. Al estudiarla con atención al papel de los líderes religiosos, impresionan las cualidades éticas y morales que se esperaban de ellos.
El capítulo sigue este orden. Primero presenta lo que se espera del ministro desde el punto de vista bíblico. Luego hace un recorrido por los líderes del pueblo de Israel: los patriarcas, Moisés, los sacerdotes y los profetas. Después pasa al Nuevo Testamento: el criterio de Jesús al escoger a los doce y los requisitos para los discípulos, los apóstoles y los misioneros.
Estas enseñanzas dan la base para establecer los criterios de los ministros de hoy, y además inspiran a luchar por ponerlos en práctica.` },
    { id: '1.1', t: '¿Qué se espera del ministro de Dios?', b: `El ministro de Dios tiene que ser una persona con una experiencia religiosa muy profunda, que abarca el **nuevo nacimiento** y un **caminar constante con Dios**. Tiene que haber conocido a Dios en forma personal.
No se pueden fijar pautas para esa experiencia, porque Dios se revela a cada uno de forma distinta:
- Abram caminaba bajo las estrellas cuando Dios le habló.
- Moisés apacentaba ovejas en el desierto y Dios le habló desde la zarza ardiente.
- Jacob huía de su casa después de pelear con su hermano, y Dios le habló en un sueño.
- Pablo iba a perseguir a los cristianos cuando la luz del cielo lo detuvo.
Las circunstancias cambian, pero quien de verdad se ha convertido no puede negar que escuchó la voz de Dios.
**Sed por las almas.** El ministro anhela que otros vivan la misma experiencia y se sacrifica por ello, como Andrés, que corrió a contarle a su hermano Pedro que había encontrado a Jesús. Lo lamentable es que muchos pierden el celo evangelizador después de los primeros meses o años de su conversión.
**Una vida devocional activa.** Sin ella no hay eficacia en el ministerio. Muchas veces quien debe ser ejemplo no lo es en su comunión con el Señor por medio de la lectura de la Biblia, la meditación y la oración. Los discípulos vieron que Cristo se levantaba muy de mañana para orar a solas (Mr 1:35, Lc 6:12).
El ministro debe ser persistente y mantener su vida devocional a todo costo. Le ayudan los libros devocionales, las biografías de grandes personajes y los programas de desarrollo espiritual.` },
    { id: '1.2', t: 'El ejemplo de los patriarcas', b: `Los primeros líderes del pueblo de Dios tenían responsabilidades cívicas, sociales y religiosas a la vez. Noé y Abraham se sentían responsables por su familia inmediata y por la familia extendida. Isaac y Jacob guiaban a toda la comunidad según las normas que Dios les había revelado.
Aun antes de los Diez Mandamientos, estos patriarcas exigían respeto por la propiedad, protegían el matrimonio y respetaban la vida humana.
La Biblia muestra su vida tal como era, con sus pecados:
- **Noé** se emborrachó, y eso se vio como pecado (Gn 9:21). Al despertar pronunció una maldición sobre Canaán, hijo de Cam.
- **Abraham** salió de Harán obedeciendo el llamado de Dios y fue líder espiritual y político. Pecó al decir en Egipto que Sara era su hermana, por miedo a perder la vida, pero se arrepintió. Mostró su dedicación al dar los diezmos a Melquisedec (Gn 14:17-24), y su fe fue probada con el mandato de sacrificar a su hijo (Gn 22).
- **Jacob** engañó a su hermano Esaú y a su suegro, pero era sensible a la voz de Dios. Hizo un voto de consagración (Gn 28:20-22), y cuando sus hijos tuvieron problemas morales llamó a toda su familia a volver a Dios (Gn 35:2).
**La lección:** el líder de la familia y de la tribu temía a Dios y se hacía responsable del desarrollo moral y espiritual de todos los que tenía a su cargo.` },
    { id: '1.3', t: 'Moisés', b: `Moisés fue libertador, legislador y representante espiritual de Dios ante el pueblo. Su vida inspira a todo ministro, porque obró sintiendo que Dios lo había llamado. Nunca se apartó de aquella llama de la zarza ardiente por medio de la cual Dios lo envió a Egipto a liberar a los esclavos (Éx 3:2-10).
Su experiencia más dramática fue ser el **mediador** por medio del cual Dios entregó los Diez Mandamientos. Al bajar del monte Sinaí encontró al pueblo danzando alrededor de un becerro de oro (Éx 32). Dios llamó al pueblo al arrepentimiento, y Moisés actuó como mediador entre el pueblo y Dios.
En los años del desierto vivió pruebas y hasta depresión, pero siempre llevó sus cargas a Dios, y Dios lo levantaba para seguir adelante.
**Una cualidad clave para el ministro:** ser una persona que lleva sus cargas a Dios y confía en el poder del Dios que lo llamó. Moisés fue fiel a pesar de los sufrimientos y de la oposición de su propio pueblo.` },
    { id: '1.4', t: 'Los sacerdotes', b: `Los sacerdotes eran los líderes que mediaban entre el pueblo y Dios en los sacrificios. Dios les dio requisitos de mucho significado:
- **Su vestido.** Llevaban los nombres de las tribus de Israel en el pectoral, sobre el corazón, como memorial delante de Jehová (Éx 28).
- **Su familia.** Los hijos de Aarón participaron en su consagración (Éx 29), y la conducta de los hijos afectaba la honra del sacerdote (Lv 21:9).
- **Su sostenimiento.** Comían de lo que se ofrecía en la expiación (Éx 29:33).
- **Su sobriedad.** No debían beber vino ni sidra al entrar al tabernáculo, para poder distinguir entre lo santo y lo profano (Lv 10:9-10).
- **Su matrimonio.** No podían casarse con una ramera ni con una mujer repudiada (Lv 21:7).
- **Su cuerpo.** Debían estar sin defecto físico para acercarse al altar (Lv 21:18-20).
**Principios para hoy.** Aunque no se exijan de forma legalista, estas normas enseñan que el ministro es un líder espiritual que debe merecer el respeto de la comunidad. No debe tener nada que cause falta de respeto hacia su oficio. Su presentación personal es importante, y su familia también participa de su llamado.` },
    { id: '1.5', t: 'Los profetas', b: `Ya en tiempos de Samuel había grupos de profetas que destacaban los valores morales de la nación (1 S 10:10-11). Los profetas eran la **conciencia moral del pueblo**:
- Natán fue enviado a declarar a David su pecado (2 S 12).
- Elías denunció a Acab cuando quiso quitarle la viña a Nabot (1 R 21).
Los profetas condenaban la injusticia económica, la opresión de los pobres, la mentira, el engaño y la corrupción personal y social. Eso significa que ellos mismos tenían que ser ejemplo de las virtudes contrarias.
Algunos profetas aconsejaban a reyes y príncipes. Eso deja una pregunta para hoy: ¿cómo puede el ministro ser consejero de los gobernantes sin meterse en la política?
También había **falsos profetas**, que hablaban para manipular al pueblo en vez de comunicar el mensaje de Dios. «Así ha dicho Jehová acerca de los profetas que hacen errar a mi pueblo, y claman: Paz, cuando tienen algo que comer» (Mi 3:5).
El profeta verdadero clamaba por una vida moral que respaldara al mensajero de Dios. Ese es el mismo ideal para el ministro de hoy.` },
    { id: '1.6', t: 'Las enseñanzas de Jesús', b: `Los Evangelios muestran tanto las cualidades que deben tener los líderes religiosos como las que no deben tener.
No hay un pasaje que diga qué criterio usó Jesús para escoger a los doce. En su sabiduría divina veía lo que había en el corazón y el potencial de cada uno.
Jesús los llamó a una vida diferente:
- A dejar su trabajo para dedicarse al discipulado.
- A dejar a sus familias, al menos por temporadas, para acompañarlo por Palestina.
- A tomar la cruz y embarcarse en una misión espiritual.
Jesús observaba el progreso de cada discípulo. **Judas** no pasó las pruebas finales porque era ladrón de corazón (Jn 12:6). Los demás tuvieron que luchar con el egoísmo, que provocaba disputas entre ellos (Mt 20:23-28).
El **Sermón del monte** presenta las normas éticas más altas de todos los maestros de la historia, y el ministro tiene el desafío de seguirlas.
Jesús resumió la Ley, los profetas y sus propias enseñanzas en un mandamiento: amar a Dios y amar al prójimo como a uno mismo (Mt 22:37-40). **El amor es la cualidad que garantiza cada día el éxito del ministro.**` },
    { id: '1.7', t: 'Los Hechos de los Apóstoles', b: `La iglesia naciente tenía líderes cuyas cualidades morales y espirituales despertaban el respeto de los creyentes.
Cuando la iglesia creció, hubo que buscar personas para servir como diáconos. Debían ser **«de buen testimonio y llenos del Espíritu Santo»** (Hch 6).
Bernabé, Felipe, Esteban, Saulo, Timoteo, Tito, Silas, Lidia y Dorcas se destacan como líderes durante la expansión de la iglesia por Asia Menor hasta llegar a Roma.
La calidad de su vida moral y su consagración fueron la clave del crecimiento numérico y espiritual de la iglesia. El autor anima a recuperar ese celo evangelizador imitando su sinceridad, su dedicación al Señor y su compromiso con Dios.` },
    { id: '1.8', t: 'Las enseñanzas de Pablo', b: `Pablo enseñó a los jóvenes ministros con su palabra y con su ejemplo. Algunos de sus pasajes son para todos los cristianos, pero otros son especialmente para el ministro.
La base de su ética pastoral es el **señorío de Cristo** (Gá 2:20). En todas sus cartas se presenta como esclavo y siervo de Jesucristo, que no se pertenece a sí mismo (Ro 14:7-9).
- **Los fuertes y los débiles.** Los fuertes deben aconsejar a los débiles con misericordia, para restaurarlos a la comunión con Dios y con la iglesia (1 Co 9:19-23).
- **El sufrimiento.** Pablo sufrió abusos de gente de afuera y de adentro de la iglesia, y tuvo que defender su ministerio (2 Co 10-12).
- **El fruto del Espíritu.** Amor, gozo, paz, paciencia, benignidad, bondad, fe, mansedumbre y templanza (Gá 5:22-23). Si el ministro lo toma como meta, tendrá madurez espiritual y será fructífero.
- **El amor.** En 1 Corintios 13 presenta el desafío de amar en las relaciones. Esa cualidad distinguía a las iglesias primitivas y era la clave de su crecimiento.
- **Los requisitos para pastores.** 1 Timoteo 3:1-7 y Tito 1:5-9 son el resumen más completo de normas éticas para ministros que hay en la Biblia. Los jóvenes ministros deben estudiarlos a fondo.` },
    { id: '1.9', t: 'La epístola a los Hebreos', b: `El autor de Hebreos es desconocido, pero conocía bien el papel de los sacerdotes en el judaísmo y había tenido una conversión dramática a Cristo.
En Hebreos 13:7 dice: **«Acordaos de vuestros pastores, que os hablaron la palabra de Dios. Considerad cuál haya sido el resultado de su conducta, e imitad su fe.»**
Este versículo afirma la importancia del testimonio del pastor por medio de su conducta.
Algunas personas se impresionan al escuchar el evangelio en un autobús, en una tienda o en un parque. Otras observan durante meses la conducta del pastor antes de considerar su mensaje. Tal vez el comerciante de la esquina mira si el pastor paga el pan y la leche para decidir si su mensaje vale algo.
**La moral del ministro respalda su mensaje.**` },
    { id: '1.10', t: 'Las epístolas de 1 y 2 de Pedro', b: `Pedro llama a los cristianos a dar buen testimonio en medio de las tribulaciones. Motiva a los líderes a seguir la voluntad de Dios, porque fueron llamados según ella (1 P 1:14-16).
- **Urgencia.** Anima a ejercer el ministerio sabiendo que el tiempo es corto (1 P 4:7, 2 P 3:11-14). Nadie sabe el día ni la hora de la venida de Cristo.
- **Buenos administradores de la gracia de Dios** (1 P 4:10). Los cristianos no corren con los inconversos en el mismo desenfreno.
- **Sobriedad y oración.** Los ministros deben ser sobrios y velar en oración (1 P 4:7).
- **Tres funciones del ministro.** Pedro menciona la administración, la predicación y el servicio (1 P 4:10-11). Estas tres actividades abarcan las funciones principales del ministro.` },
    { id: '1.11', t: 'Las epístolas de Juan', b: `A Juan le tocó escribir en una época de mucha oposición al cristianismo. Había falsos maestros, los «anticristos», que seguían doctrinas gnósticas.
El maestro verdadero **anda en la luz y habla la verdad** (1 Jn 1:6, 2:4-6). Juan destaca el amor, la fe y la fidelidad a la verdad como las virtudes que hacen vencer al cristiano.
Sus cartas llaman a los ministros a servir aun en medio de la oposición y a tener discernimiento para distinguir entre la verdad y el error.
«Mirad por vosotros mismos, para que no perdáis el fruto de vuestro trabajo, sino que recibáis galardón completo» (2 Jn 8).` },
    { id: '1.12', t: 'El Apocalipsis de Juan', b: `El Apocalipsis fue escrito a los **«ángeles» de las siete iglesias** de Asia Menor, y se entiende que eran los pastores de esas iglesias. Es un tipo de literatura que consuela a quienes sufren bajo un gobierno pagano y hostil al cristianismo.
Esos pastores sufrieron mucho por su fidelidad en medio de la persecución. Hoy hay lugares donde los ministros pasan por el mismo crisol, y quienes viven en libertad a veces olvidan a los que están en la cárcel por predicar.
La persecución separa a los sinceros de los que sirven por otros motivos. A veces viene de los enemigos del evangelio y a veces de los mismos cristianos.
Cuando toca sufrir por la fe, se ve si el compromiso va más allá de los tiempos fáciles. Ahí se manifiestan la sinceridad y la fidelidad del ministro.` },
    { id: 'Conclusión', t: 'Conclusión', b: `En cada época de la historia bíblica, la revelación divina resalta los altos requisitos para los siervos del Señor. En una clase, un seminarista sacó veintiocho principios bíblicos para ministros y otro sacó veinte.
El libro sigue un orden: primero la persona del ministro y su ética personal, luego su familia, después la iglesia local, la denominación y, por último, las relaciones fuera de su denominación.` }
  ]
},
{
  n: 2, title: 'La ética personal del ministro', ring: 'Persona', frase: 'El ministro consigo mismo: su llamado, su salud y su integridad.',
  resumen: {
    idea: 'El ministro debe cuidarse a sí mismo antes de servir a otros. Esto incluye estar seguro de su llamado, cuidar su salud completa y vivir con integridad moral y económica.',
    puntos: [
      'El llamado de Dios da firmeza. Puede llegar como deseo de servir, como convicción o como una voz.',
      'Hay que examinar los motivos ocultos del llamado y purificarlos, sin abandonar el ministerio.',
      'Bratcher describe el síndrome de «caminar sobre el agua», la necesidad de parecer perfecto.',
      'Salud emocional: equilibrio y dominio propio (2 Ti 1:7).',
      'Salud física: ejercicio, descanso, examen médico y vacaciones.',
      'Salud intelectual: de 3 a 4 horas diarias de estudio.',
      'Salud espiritual: un tiempo diario personal con Dios, como Jesús.',
      'Ser irreprensible: dominio propio y medidas para prevenir caídas morales.',
      'No servir por dinero, aunque la iglesia debe pagar un sueldo digno.'
    ],
    recuerda: 'Si el ministro no está bien, su familia y su iglesia también sufren.'
  },
  subs: [
    { id: 'Intro', t: 'Introducción', b: `El capítulo 1 mostró que la Biblia es la base de autoridad para las normas éticas del ministro. Sus enseñanzas llegan a veces como mandamientos y otras veces como ejemplos de personas que nos guían hoy.
El ministro siempre toma decisiones que lo afectan a él, a su familia, a la iglesia, a la comunidad y al mundo. Ser ministro hoy exige lo mejor que uno puede ofrecer a Dios y al prójimo.` },
    { id: '2.1', t: 'El llamado de Dios al ministro', b: `En algunas denominaciones elegir el ministerio es una decisión racional. En muchas otras se insiste en que el ministro debe tener la **convicción firme de que Dios lo llamó**, porque esa convicción lo sostiene en las dificultades y le da permanencia.
Se espera una experiencia como la de Pablo y Bernabé: «Apartadme a Bernabé y a Saulo para la obra a que los he llamado» (Hch 13:2).
Unos sienten el llamado como un deseo profundo de servir al Señor. Otros lo resisten mucho tiempo antes de rendirse.
**El testimonio del autor.** De joven admiraba la consagración de su pastor y deseó dedicarse a predicar. En la universidad escuchó a veteranos de guerra y a adultos que habían resistido el llamado por años, y empezó a dudar del suyo porque no lo había resistido. Esa ansiedad afectó su vida devocional, hasta que un profesor sabio le explicó que muchos son llamados por medio del deseo de servir, como Isaías, que se ofreció voluntariamente. Eso le dio paz para seguir preparándose.` },
    { id: '2.1.1', t: 'Los componentes del llamado de Dios', b: `El doctor Jorge Gaspar Landero escribió que el pastor es hombre de Dios por llamamiento divino, que vive para su iglesia y sufre por ella. A. T. Bequer afirma que es imposible pastorear sin haber sentido el llamamiento de lo alto, porque la misión del pastor tiene muchas facetas.
El llamado puede llegar de varias formas:
- Como una voz audible, igual que a muchos personajes bíblicos.
- Como una convicción interna que persiste durante mucho tiempo.
- Al considerar las necesidades del mundo de hoy.
No se le puede dictar a Dios cómo llamar, porque Él es soberano. Pero cada uno debe escuchar su voz y responder con convicción.
H. C. Brown decía que el pastor que tiene paz sobre su llamamiento sabe que Dios lo llamó. Debe arder por dentro la llama de la que habló Pablo: **«¡Ay de mí si no anunciare el evangelio!»** (1 Co 9:16). Hay un elemento divino en el llamado.` },
    { id: '2.1.2', t: 'Los elementos inconscientes en el llamado', b: `José María Martínez aconseja examinar con la mayor objetividad posible los motivos que lo llevan a uno al ministerio. La sicología enseña que actuamos por motivos conscientes e inconscientes.
**Motivos que algunos descubren con el tiempo:**
- La necesidad de ser aceptados por los demás.
- El deseo de ser estrellas o actores.
- Expiar la culpa por un pecado del pasado.
- La presión de los padres o familiares, lo que Freud llamó el «super yo».
- El poder y el prestigio sobre otras personas.
- Huir de la soledad. Paradójicamente, el aislamiento es uno de los mayores problemas de los ministros, que muchas veces llevan una máscara que los separa de la congregación.
**El síndrome de «caminar sobre el agua».** Edward Bratcher dice que muchos ministros sienten la necesidad de aparentar que pueden resolverlo todo, hacer milagros, ser los mejores oradores y ser infalibles en doctrina. Eso produce tres actitudes dañinas:
1. Sentimientos de debilidad y poca estima propia.
2. La sensación de no estar a la altura de las demandas de todos.
3. La necesidad de llevar una máscara profesional que esconde las emociones verdaderas.
**¿Qué hacer?** No abandonar el ministerio. J. B. Phillips aconseja pulir los motivos para hacerlos menos egoístas. Cuanto más saquemos a la luz esos motivos y los manejemos de forma consciente, más efectivos seremos en el ministerio.` },
    { id: '2.2', t: 'La salud del ministro', b: `El ministro tiene el deber, hacia sí mismo, hacia Dios y hacia su familia, de mantenerse en el mejor estado de salud posible. Cuando pierde su salud física, emocional o espiritual, disminuye su eficacia.
Por eso la ética personal incluye cuidarse en cuatro áreas: la emocional, la física, la intelectual y la espiritual.` },
    { id: '2.2.1', t: 'La salud emocional', b: `Después de unos años, el pastor puede descubrir que sufre un estrés acumulado. Unos esperan que sea gran orador, otros que administre como una empresa moderna, otros que visite más o que esté siempre disponible para aconsejar. Además, su familia le reclama que dedica todo su tiempo a los miembros. Todo eso puede llevarlo a una crisis.
En un solo día puede oficiar un funeral, visitar en el hospital a unos padres felices por un nacimiento y a alguien que está muriendo, y terminar en una boda. Necesita identificarse con cada persona sin perder su propio equilibrio. Pablo lo dice así: **«No nos ha dado Dios espíritu de cobardía, sino de poder, de amor y de dominio propio»** (2 Ti 1:7).
Wayne Clark señala como problemas comunes el resentimiento, la inmadurez, el sentido de inferioridad, las dudas, la culpa y la soberbia. El fruto del Espíritu (Gá 5:22-23) ayuda a combatir la inseguridad, la culpa y la necesidad de atacar a otros.
**Señales de falta de salud emocional:**
- Sacrificar a la esposa y a los hijos creyendo que es consagración, cuando en realidad se está cubriendo una inseguridad.
- Sentir que tiene que ganar toda controversia en la iglesia, con actitud de dictador.
- Trabajar largas horas los siete días de la semana por una compulsión.
- Querer cambiar de iglesia cada dos o tres años, buscando siempre algo más grande, como quien escala montañas sin descansar nunca.
La salud emocional incluye saberse aceptado por Dios y por los demás. Tomás Harris lo expresa en su libro *Yo estoy bien, tú estás bien*. Wayne Oates también cuenta su lucha contra la inferioridad y el aislamiento.` },
    { id: '2.2.2', t: 'La salud física', b: `La salud física está muy ligada a la emocional. El ministro necesita dormir lo suficiente, comer sano y hacer ejercicio cada día, porque pasa mucho tiempo sentado preparando sermones y estudios.
- **El peso.** Después de los 35 años muchos ministros aumentan de peso por falta de ejercicio y exceso de comida. La **glotonería** es uno de los pecados más comunes entre ministros, porque los miembros siempre los invitan a comer.
- **El ejercicio.** Los médicos recomiendan acelerar el corazón de forma sostenida veinte minutos al día. No hace falta un programa agotador, basta un ejercicio suave y vigilar lo que se come.
- **El examen médico.** Cada dos años antes de los 50 años, y cada año después.
- **El estrés.** Brooks Faulkner escribió *Burnout in Ministry* sobre el agotamiento de los ministros. Cada uno debe encontrar su forma de relajarse y practicarla con regularidad.
- **La recreación y la familia.** Es bueno apartar un día para estar con la familia.
- **Las vacaciones.** Cada año. La iglesia debe animar al pastor a tomarlas. Puede aprovechar para leer, planear su predicación y visitar otras iglesias.
- **Saber decir que no.** Wayne Oates advierte contra aceptar todas las invitaciones a predicar o dar conferencias. Muchos ministros descubren a los 45 años que lograron la fama, pero perdieron el amor y el respeto de su esposa y de sus hijos.` },
    { id: '2.2.3', t: 'La salud intelectual', b: `El pastor alimenta intelectualmente a su congregación dos o tres veces por semana. Para hacerlo bien necesita **de tres a cuatro horas diarias** de preparación. Muchas personas dejan de asistir a la iglesia porque no reciben estímulo intelectual.
- Debe estudiar toda la vida y leer de forma variada, usando lo que lee como ilustraciones.
- No se espera que sea especialista en todo, pero sí que esté informado de lo que pasa en el mundo. Su predicación muestra si está estudiando o si repite ideas viejas.
- La gente busca algo nuevo, como los filósofos que escuchaban a Pablo en Atenas (Hch 17:18).
- Cada uno decide su mejor horario y lugar para estudiar, en casa o en el templo, de mañana o de noche. Lo indiscutible es que debe dedicarle tiempo.
- Debe actualizarse en doctrina, teología y filosofía. Pablo le dijo a Timoteo: «Ocúpate en la lectura, la exhortación y la enseñanza» (1 Ti 4:13).
- Puede tomar cursos en seminarios o universidades, usar las bibliotecas y leer un libro nuevo cada mes.` },
    { id: '2.2.4', t: 'La salud espiritual', b: `Es paradójico que quien inspira a tantos a orar descuide su propia vida devocional. Encuestas en seminarios muestran que muchos necesitan apartar un tiempo diario para leer la Biblia y hablar con Dios para su propio beneficio.
Algunos ministros piensan que, como pasan el día orando por otros y preparando mensajes, no necesitan un tiempo propio con Dios. **Es un error de lógica.** Quien medita cada día en la Palabra para sí mismo ministra con más eficacia y autoridad.
La predicación sin oración produce congregaciones muertas. La falta de salud espiritual es una de las razones por las que algunos ministros abandonan el ministerio.
**Jesús es el ejemplo.** Se apartaba a orar al monte de los Olivos, «como solía» (Lc 22:39-40).
Además de la Biblia y la oración, cada uno puede buscar lo que le ayude: leer sermones de predicadores respetados, escuchar predicaciones por radio, la música sagrada, o libros como los de James D. Crane sobre la oración y *Spiritual Direction* de Martin Thornton.` },
    { id: '2.3', t: 'Una ética de compromiso', b: `Los ministros no solo deben saber dirigir la iglesia. También deben ser personas de carácter elevado, con cualidades que muestren un desafío real a seguir a Cristo.` },
    { id: '2.3.1', t: 'Una ética irreprensible', b: `Entre los requisitos que Pablo da para los pastores en 1 Timoteo 3 aparece la palabra **«irreprensible»**. Es la norma ética más alta para la vida personal y pública del ministro.
- **Templanza.** Dominar los deseos carnales. El testimonio de la iglesia sufre cuando el ministro cae en el alcohol, el tabaco, las drogas o cualquier otro vicio. La gente no tiene paciencia con el ministro que es descubierto en ellos.
- **Los impulsos sexuales.** El matrimonio es la forma sana de expresar el amor, incluida la sexualidad. Pero con frecuencia se sabe de pastores que fracasan por una relación fuera del matrimonio, lo que deshonra a Dios, al ministerio y a la comunidad cristiana.
**Medidas de prevención:**
- No ofrecerse a llevar a una dama sola en el auto o la moto. Algunos que cayeron dicen que todo empezó con ese gesto de cortesía.
- En la consejería, tomar precauciones para evitar malentendidos y chismes.
- No ir a la casa de una señora cuando su esposo no está, a menos que lo acompañe su propia esposa.
- Si aconseja en el templo, que haya otras personas en el edificio.
- Si la oficina no tiene ventana, dejar la puerta abierta.
Ni siquiera Pablo escapó de los ataques de sus enemigos y tuvo que defender su ministerio (1 Co 9:3-5). El ministro debe cuidar cada uno de sus actos.` },
    { id: '2.3.2', t: 'Una ética económica', b: `El ministro no tendrá éxito si lo mueve el dinero. Casi siempre servirá sin mucha recompensa material, y su mayor recompensa es la satisfacción de ayudar a otros. Jesús prometió que quien deja casa o familia por el reino recibirá mucho más en este tiempo y la vida eterna (Lc 18:29-30).
La situación económica es uno de los puntos más sensibles. La mayoría de los pastores vive preocupada por necesidades que su sueldo no cubre. Hay meses con más días que dinero.
Encuestas en varios países muestran que muchos pastores reciben menos del salario mínimo, y mucho menos que otros profesionales con la misma preparación.
La Biblia dice: **«Digno es el obrero de su salario»** (Mt 10:10, 1 Ti 5:18). Las iglesias deben estudiar el sueldo de su pastor y aumentarlo cada año.` },
    { id: 'Conclusión', t: 'Conclusión', b: `El ministro es un siervo del Señor dedicado a una misión espiritual. Para cumplirla necesita una autoimagen sana y alegría en su llamado. No será eficaz si sirve con resentimiento por no ganar lo que otros ganan.
Debe respetarse a sí mismo y cuidar su cuerpo y su salud, porque su eficacia será proporcional a su buena salud. También debe mantenerse alerta intelectualmente para alimentar a los feligreses con un mensaje basado en la Palabra de Dios y que responda a las necesidades del mundo de hoy.` }
  ]
},
{
  n: 3, title: 'El ministro y su familia', ring: 'Familia', frase: 'Su esposa y sus hijos, el primer lugar donde sirve.',
  resumen: {
    idea: 'El hogar es el primer lugar donde el ministro sirve. Una familia feliz respalda su ministerio.',
    puntos: [
      'Amar a la esposa como Cristo amó a la iglesia, con tiempo y detalles.',
      'Tener una cita especial con la esposa cada semana o cada quince días.',
      'Dar tiempo diario a los hijos y disciplinarlos entre los dos padres.',
      'La falta de dinero es la mayor causa de estrés en los hogares pastorales.',
      'La esposa del pastor no puede cumplir todas las expectativas tradicionales de la iglesia.',
      'Cada pareja elige un modelo de autoridad, jerárquico o democrático, y lo aplica con coherencia.',
      'La familia pastoral necesita privacidad y una casa cerca del templo, pero no pegada a él.',
      'El pastor y su esposa no deben discutir sus diferencias en público.'
    ],
    recuerda: 'La familia es la carta de presentación del pastor ante la iglesia.'
  },
  subs: [
    { id: 'Intro', t: 'Introducción', b: `La felicidad en el hogar del ministro contribuye mucho a su éxito. Por eso debe dedicar tiempo a su esposa y a sus hijos. Si los descuida mientras atiende a todos los demás, los hijos pueden llegar a resentir que su padre tenga tiempo para otros y no para ellos.
Las estadísticas muestran que los hijos de ministros se destacan en muchas profesiones. Por eso el pastor y su esposa no deben angustiarse por las privaciones materiales. La aceptación, el calor emocional y el estímulo a tener metas altas compensan la falta de cosas. Los hijos aprenden a apreciar los valores más altos de la vida.` },
    { id: '3.1', t: 'Deberes del esposo y padre', b: `El esposo tiene la responsabilidad de hacer todo lo posible por la felicidad de su hogar.
La cultura tradicional dice que él es el sostén económico, pero hoy es aceptable que la esposa trabaje y ayude con los gastos. Eso trae tensiones, porque ella tiene menos tiempo para el hogar, y el esposo debe adaptarse a esas nuevas circunstancias.` },
    { id: '3.1.1', t: 'Deberes hacia la esposa', b: `Edward Bratcher estudió las fuentes de estrés en la familia del pastor:
- La iglesia espera que la familia pastoral sea ejemplo de armonía y de prosperidad, aunque el sueldo no alcance.
- El ministro necesita una familia ejemplar para dar credibilidad a su ministerio, y eso presiona a todos.
- La congregación impone papeles tradicionales que no dejan a la familia tener su propia identidad. El autor cuenta que no dejó a su hija tomar clases de ballet por miedo al «qué dirán», y su esposa le reclamó después esa decisión.
- Algunas iglesias esperan que la esposa sea una «pastora asociada» sin sueldo.
- El descuido del esposo. La esposa de un obispo anglicano dijo que se sentía como viuda porque su esposo nunca estaba en casa.
- La falta de privacidad, porque la casa pastoral siempre está abierta.
- El aislamiento, porque aunque estén rodeados de gente, no tienen amigos íntimos en quienes confiar.
**La respuesta bíblica es amar a la esposa como Cristo amó a la iglesia:**
1. Con un amor sin condiciones.
2. Con un amor dispuesto a sacrificarse por ella.
3. Poniendo primero las necesidades de ella, sin egoísmo.
4. Con un amor que es más que sexo: felicitarla por la comida, agradecer sus atenciones, recordar su cumpleaños y el aniversario.
El pastor debe establecer **una cita especial con su esposa una noche por semana o por quincena**. No hace falta gastar mucho dinero. Ella agradecerá el tiempo dedicado solo a ella.` },
    { id: '3.1.2', t: 'Deberes hacia sus hijos', b: `El pastor debe ser buen ejemplo como padre. Todo niño necesita el tiempo de sus padres, en especial del papá. El padre debe programar un tiempo diario con sus hijos y no llegar tan cansado que no pueda jugar con ellos.
- Interesarse en lo que estudian y ayudarles de vez en cuando con las tareas.
- Asistir a las reuniones de padres de familia, porque los hijos captan el mensaje.
- **Disciplinarlos.** Es responsabilidad de ambos padres, y el papá no debe dejarla toda a la mamá. Por medio de la disciplina los niños aprenden a respetar la autoridad y, de adultos, sabrán ejercerla. Debe ser constante. Los padres que no disciplinan no saben el daño que hacen.` },
    { id: '3.1.3', t: 'Deberes respecto al sostenimiento del hogar', b: `La iglesia tiene la responsabilidad de pagar al pastor un sueldo digno. En todos los estudios sobre el estrés en los hogares pastorales, **los ingresos inadecuados encabezan la lista**.
El autor hizo una encuesta entre pastores de América Latina, y casi todos señalaron la estrechez económica como una de sus mayores dificultades.
Los laicos deben ser buenos mayordomos y sostener dignamente a su pastor. En la familia, todos deben colaborar para economizar cuando hay escasez.
Si la iglesia no puede pagar lo suficiente, el pastor puede pedir permiso para un empleo adicional, como dar clases unas horas. No es lo ideal, pero a veces es necesario.` },
    { id: '3.1.4', t: 'Deberes respecto al desarrollo espiritual de cada uno en el hogar', b: `Así como es líder espiritual de la iglesia, el pastor es el líder espiritual de su familia y debe tomar la iniciativa.
- Tener un culto familiar diario y también momentos a solas con cada hijo.
- Estar disponible cuando los hijos tienen inquietudes espirituales. Dichoso el pastor que lleva a cada uno de sus hijos a Cristo.
- Dar atención especial a los adolescentes, que enfrentan tentaciones fuera del hogar y decisiones sobre su vocación.
La queja más frecuente de la familia es que **el padre no pasa suficiente tiempo con ellos**. Muchas veces tenemos tiempo para los hijos de todos menos para los nuestros.
**Vacaciones en familia.** Planearlas juntos cada año une a la familia y deja buenos recuerdos.
**Cuando los hijos ya son adultos** es tiempo de reflexionar y de perdonar. Los hijos perdonan los errores de crianza y los padres perdonan las tribulaciones de esos años. David Seamonds, en *The Healing of Memories*, recomienda confesar a Dios el resentimiento, con la ayuda de un ministro, y orar pidiendo sanidad emocional.` },
    { id: '3.2', t: 'El lugar de la esposa del pastor', b: `La esposa del pastor puede asegurar el éxito de su esposo en el ministerio o llevarlo al fracaso.
La joven que se enamora de un futuro pastor debe pensar seriamente si podrá ser feliz en ese papel. Antes de comprometerse debe orar mucho y conversar con otras esposas de pastores.
Bratcher explica que el pastor, como otros profesionales, debe estar disponible las veinticuatro horas, y la esposa debe entenderlo para no desilusionarse. Agrega que es aún más difícil cuando el esposo entra al ministerio después de tener otra profesión, porque ella debe cambiar de identidad.` },
    { id: '3.2.1', t: 'El papel de esposa del pastor', b: `Tradicionalmente la esposa del pastor era su «ayudante». Se esperaba que:
- Mantuviera el hogar en orden, con comida, ropa, aseo y compras.
- Estuviera en todos los cultos y reuniones de la denominación.
- Participara en las organizaciones femeniles, la enseñanza de los niños y la música.
- Apoyara al esposo sin cuestionar nada y le sirviera de secretaria.
- Fuera un ejemplo sobresaliente de espiritualidad.
Nadie puede cumplir todo eso, pero muchos en la iglesia lo esperan.
En los últimos años algunas esposas de pastores rechazaron ese papel. Quieren ser independientes de la profesión del esposo, y algunas trabajan fuera del hogar. Como resultado, la iglesia tiene expectativas más reales. El movimiento de liberación femenina también influyó.
**La opinión del autor.** Cree que el cristianismo ha tratado mal a las mujeres, aprovechando sus servicios sin dejarlas ocupar los puestos más altos. Ve muchos puestos que pueden ocupar, incluso la presidencia de organizaciones de la denominación, pero todavía no acepta que una mujer sea ordenada como pastora.` },
    { id: '3.2.2', t: '¿Dominio o sumisión en el matrimonio?', b: `Las enseñanzas de Pablo y Pedro sobre la sumisión de la esposa causan controversia. El pastor y su esposa deben definir sus normas, porque todos en el hogar esperan señales claras sobre la autoridad y la disciplina.
**Dos formas de ver la autoridad en el hogar:**
- **Jerarquía de autoridad.** Dios da autoridad a Cristo, Cristo al esposo, el esposo a la esposa y luego a los hijos. Cada uno se sujeta al de arriba. La proponen Bill Gothard y Timoteo LaHaye, con base en Efesios 5 y 6, Colosenses 3 y 4 y 1 Pedro 3.
- **Relación democrática.** Todos pueden participar en las decisiones después de considerar cada situación, y los hijos también colaboran. La proponen Tomás Gordon y Haim Ginott, que sugieren explicar a los hijos el porqué de las normas, porque el niño que crece con imposiciones sin explicación se frustra y se rebela.
Cada matrimonio debe decidir qué modelo es mejor para ellos y ser consecuente. Esa unidad trae armonía y evita conflictos. El pastor debe respetar y apoyar siempre a su esposa en la disciplina y en las decisiones del hogar.` },
    { id: '3.2.3', t: 'Deberes de la esposa del pastor', b: `La Biblia habla de los deberes de las esposas en Efesios 5:22-24, Colosenses 3:18 y 1 Pedro 3:1-7.
- **La sujeción (Ef 5:22).** Pablo habla desde el siglo primero, cuando la mujer era considerada inferior. En la comunidad cristiana significa que el esposo es responsable del sostén, la dirección, los valores y las metas del hogar, siempre con la participación de la esposa. Por ejemplo, ante un traslado oran y dialogan juntos, pero al final él asume la responsabilidad de la decisión. No significa que sea un dictador que decide todo sin consultar.
- **El adorno interno (1 P 3:3-4).** No los peinados ostentosos ni los vestidos lujosos, sino un espíritu afable y apacible. El autor cuenta de una esposa criticada por usar zapatos rotos y luego criticada por tener varios pares. El consejo es vestir de forma normal y vivir al nivel promedio de la congregación, ni muy arriba ni muy abajo.
- **Las virtudes.** Compasión, amabilidad y no devolver mal por mal (1 P 3:8-9).
- **Apoyar la influencia de su esposo.** Cuidar su apariencia y colaborar para que su ministerio sea un éxito.
- **Cuidar el matrimonio.** Algunas damas llegan buscando ayuda y desarrollan fantasías con el pastor. Una relación de pareja satisfactoria ayuda a resistir la tentación. Pablo aconseja no negarse el uno al otro (1 Co 7:5).` },
    { id: '3.3', t: 'Privacidad en la familia pastoral', b: `Una queja común de la familia pastoral es la falta de privacidad. Todos saben todo: los problemas de los hijos en el colegio, cuándo salen de viaje, cuánto gana el pastor y en qué gasta. Si un hijo se porta mal, pronto lo saben los diáconos y toda la iglesia. Esto es una carga pesada para la familia.` },
    { id: '3.3.1', t: 'La iglesia necesita aceptar la «humanidad» de la familia pastoral', b: `El pastor y su familia son seres humanos con debilidades, y a veces actúan de forma poco cristiana ante una provocación. Si la iglesia les da libertad para vivir con normalidad, aceptando sus limitaciones como las de cualquier otro, les quita un peso muy grande.
A su vez, la familia debe entender que el pastor es una persona importante en la comunidad y que es normal que sus actividades interesen a los demás. Debe aprender a no molestarse por esa curiosidad.` },
    { id: '3.3.2', t: 'La iglesia debe permitir que la familia pastoral tenga privacidad', b: `La familia pastoral tiene derecho a guardar algunos secretos. Los padres deben enseñar a los hijos qué temas son solo de la familia.
- Si la iglesia evita preguntas imprudentes sobre el precio de la ropa o de los muebles, la familia vive con menos presión.
- Hay información solo para el pastor y su esposa. Por ejemplo, si consideran una invitación a otro lugar, deben orar y hablarlo entre ellos antes de decírselo a los hijos, porque los niños pueden contarlo y suelen oponerse al cambio por sus amigos.
- Está bien hablar con los hijos de la economía familiar, pero sin cargarlos de preocupación. La niñez debe ser un tiempo de alegría. Con los adolescentes se puede compartir más.` },
    { id: '3.3.3', t: 'La iglesia debe permitir que la casa pastoral sea un hogar privado', b: `En algunos países la casa pastoral está junto al templo o dentro de él. Entonces la familia sufre interrupciones constantes de personas que llegan a pedir prestada una cinta adhesiva, unas tijeras o cualquier otra cosa. La familia puede adaptarse y hasta alegrarse de colaborar.
Pero el mejor arreglo es vivir **cerca del templo, sin estar dentro ni pegado a él**. Así la familia llega fácilmente a las actividades y a la vez tiene una vida privada.
En resumen, la clave es buscar tiempo para estar juntos, jugar, dialogar y enfrentar unidos los problemas. Dichosa la familia pastoral que considera un privilegio servir en la iglesia.` },
    { id: '3.4', t: 'La intimidad entre el pastor y su esposa', b: `Muchas parejas con problemas miran el matrimonio del pastor como ejemplo. Si ven un matrimonio estable, buscarán ayuda. Si ven conflictos, se desilusionarán.
Ningún matrimonio es perfecto. La forma en que el pastor y su esposa enfrentan y resuelven sus problemas puede ser el mejor modelo para los demás.
- **Un pacto.** No discutir sus diferencias personales en público, sino resolverlas en privado.
- **Las dificultades sexuales.** Algunas personas llegan al matrimonio con ideas equivocadas, inhibiciones o traumas por abuso. Los ministros no están exentos.
- **Consejos.** El sexo en el matrimonio es normal y bueno, y ambos deben disfrutarlo. No debe ser deber de uno y privilegio del otro. Alivia la tensión, expresa el amor y une a la pareja.
- **El criterio.** Lo que la pareja hace en privado y da placer a ambos es lícito, con dos condiciones. Si uno no se siente cómodo, deben dejar esa práctica. Si algo trae consecuencias negativas, como una infección, deben suspenderlo.` },
    { id: 'Conclusión', t: 'Conclusión', b: `El pastor debe ser fiel en dar tiempo a su familia y no descuidarla por atender a la iglesia. La esposa del pastor tiene el papel de colaborar con su esposo para que sean felices en el matrimonio y en el servicio al Señor.
El autor afirma que los pastores casados y con hijos pueden tener mayor eficacia, porque los feligreses confían más en quien ha vivido experiencias parecidas. Crecer en el hogar de un pastor trae muchas bendiciones a los hijos.` }
  ]
},
{
  n: 4, title: 'Relaciones éticas con la iglesia local', ring: 'Iglesia', frase: 'La congregación que pastorea, desde que llega hasta que se va.',
  resumen: {
    idea: 'Ser pastor no es un empleo cualquiera. Desde que llega hasta que se va, el pastor debe actuar con honestidad, lealtad y servicio.',
    puntos: [
      'No ofrecerse a una iglesia. Esperar la invitación y responder pronto.',
      'Renunciar a la iglesia actual al mismo tiempo que acepta la otra.',
      'No criticar al pastor anterior ni regresar a hacer bodas o funerales donde ya no es pastor.',
      'Dejar al sucesor todo en orden y una lista de personas interesadas.',
      'Predicar con propósito y sin esquivar los temas difíciles.',
      'Formar líderes, informar a los diáconos y no abandonar la iglesia en una crisis.',
      'No hacer negocios con los miembros, ni pedirles ni prestarles dinero.',
      'Visitar con prioridades, empezando por los enfermos, y seguir las normas del hospital.'
    ],
    recuerda: 'La relación entre pastor e iglesia es una de las más felices e íntimas que existen.'
  },
  subs: [
    { id: 'Intro', t: 'Introducción', b: `Este capítulo se aplica sobre todo al pastor de una iglesia local, aunque sirve para todo ministro. Ser pastor de una congregación es un gran privilegio. La Biblia usa la imagen del pastor de ovejas para mostrar la actitud del hombre de Dios que cuida las almas.
El autor recuerda su primer pastorado, en una iglesia rural pequeña, cuando todavía estudiaba en el seminario. Durante dos años viajó unos doscientos kilómetros cada fin de semana. Al llegar visitaba a un diácono para enterarse de las noticias y luego iba a orar con los enfermos.
Al mirar atrás reconoce que cometió muchos errores, y por eso escribe, para que otros jóvenes los eviten.` },
    { id: '4.1', t: 'La invitación a ser pastor', b: `El pastorado de una iglesia no es como cualquier otro empleo. Hay pasos éticos que el ministro debe seguir para llegar a ser pastor de una iglesia, y normas para relacionarse con quien estuvo antes y con quien vendrá después.` },
    { id: '4.1.1', t: 'Cómo lograr una invitación de una iglesia', b: `Muchas iglesias bautistas no quieren una oficina que ayude a los pastores a ubicarse. Bratcher critica que el sistema de recomendaciones de amigos se presta al engaño. Si la denominación tiene un sistema, el pastor puede usarlo y orar para que Dios lo guíe.
**Normas éticas para recibir una invitación:**
- **No ofrecerse.** El ministro no debe presentarse ante una congregación para ofrecerse como pastor, igual que los médicos no salen a buscar pacientes.
- **Avisar y orar.** Debe comunicar a sus amigos y a los líderes de su denominación que está disponible, y orar para que se abra una puerta.
- **El proceso.** Un pastor o líder presenta su nombre a la iglesia. La **Comisión de Púlpito** lo estudia y ora. Si siente la guía de Dios, lo invita a predicar o a dirigir una campaña. Si Dios está obrando, casi siempre llega la invitación.
- **Responder pronto.** Debe orar, hablar primero con su esposa y luego con sus hijos, y contestar lo antes posible. No es ético tardar semanas ni aceptar para un tiempo lejano. Debe poder llegar en dos o tres meses.
- **Renunciar al mismo tiempo.** Si ya es pastor, debe renunciar a su iglesia al mismo tiempo que acepta la otra, para evitar malentendidos y sentimientos heridos.
- **No usar las invitaciones como presión.** No debe usarlas para que su iglesia le suba el sueldo ni presumir de que otras iglesias lo buscan.
**Los conflictos y el liderazgo.** Bratcher recomienda que, si hay problemas, los líderes conversen de forma abierta y honesta, siguiendo el consejo de Jesús (Mt 18:15-17). El pastor sabio pide la opinión de la congregación sobre su ministerio. Hay que evitar dos extremos: confiar todo al pastor o dar toda la autoridad a los diáconos. Lo ideal es un **liderazgo compartido**.` },
    { id: '4.1.2', t: 'Relaciones con el antecesor', b: `Al llegar a una iglesia, el pastor verá cosas que quiere cambiar. A veces el pastor anterior salió bajo presión. Algunos miembros invitarán al nuevo pastor a comer y pasarán el tiempo criticando al anterior.
- Lo prudente es **cambiar el tema** y, si insisten, explicar con amabilidad que es mejor pensar en el futuro de la iglesia.
- El antecesor sembró la Palabra en muchos corazones, y el nuevo pastor cosecha ese fruto. Cada pastor edifica sobre la obra de otros, y algún día él también será antecesor.
- Es normal que unos se entristezcan y otros se alegren cuando un pastor se va. No todos hablarán bien de nosotros: «¡Ay de vosotros, cuando todos los hombres hablen bien de vosotros!» (Lc 6:26).
- **El antecesor no debe regresar** a hacer bodas, funerales u otros actos, porque la iglesia ya tiene su pastor. Si hay un motivo fuerte, es el pastor actual quien hace la invitación. La excepción es un aniversario u otra celebración especial.` },
    { id: '4.1.3', t: 'Relaciones hacia el sucesor', b: `También hay normas para el pastor que se va:
- **Dejar todo en orden.** La lista de miembros, las actas y los informes de finanzas. Si manejó dinero, debe rendir cuentas completas. En algunos casos conviene revisar los libros para que nada afecte su buen nombre.
- **Dejar una lista de miembros en perspectiva**, con nombres y direcciones de visitantes e interesados. El autor dejó una lista así al irse al campo misionero, y meses después supo que la iglesia había bautizado a muchos de esas tarjetas.
- **No regresar** a hacer ceremonias, aunque algunas familias se lo pidan. Debe explicarles que formen una relación de confianza con el nuevo pastor y preparar a la congregación para recibirlo.` },
    { id: '4.2', t: 'Servicio fiel a la iglesia como pastor', b: `Estos consejos abarcan las áreas del ministerio en la iglesia local: la predicación de la Palabra, la visitación a los miembros y a la comunidad, la consejería y la administración general de la iglesia.` },
    { id: '4.2.1', t: 'El pastor debe proclamar el evangelio con osadía', b: `Una de las mayores necesidades de las iglesias es la predicación con poder. **La predicación pobre produce iglesias pobres** y miembros débiles. Es irónico que el pastor estudie años en el seminario y luego suba al púlpito sin un mensaje de aliento.
La gente llega preguntando lo mismo que el rey Sedequías a Jeremías: **«¿Hay palabra de Jehová?»** (Jer 37:17).
- **Predicar con un propósito.** El pastor debe ver las necesidades espirituales de la congregación y planificar su predicación. Puede hacer series sobre las sectas de la zona o sobre las preguntas que la gente se hace. Bill Weber predicó una serie llamada «Respuestas francas a preguntas difíciles», con temas como si se puede confiar en la Biblia, si se puede perder la salvación o dónde está Dios cuando sufrimos.
- **Predicar libro por libro.** W. O. Vaught, pastor por más de veinticinco años en la misma iglesia, dijo que la mayor bendición de su ministerio fue predicar versículo tras versículo los libros de la Biblia.
- **No esquivar las controversias.** La gente lee y oye las noticias. Si el pastor da la interpretación cristiana de los problemas actuales, la congregación lo agradece. Cuando salió la película «El Exorcista», dos pastores de Houston predicaron sobre el exorcismo, y unos jóvenes en Chile le pidieron al autor hablar del tema.` },
    { id: '4.2.2', t: 'El pastor debe ser buen administrador', b: `Una crítica frecuente es que los pastores no administran bien. No forman un equipo y lo hacen todo ellos mismos o con su familia. **Toda iglesia necesita preparar líderes** de forma constante.
- **Cumplir los compromisos.** Al aceptar una iglesia se acuerdan cosas como la dedicación exclusiva, los domingos fuera, las vacaciones y las reuniones de la denominación. Hay que cumplirlas o negociarlas de nuevo. Si el sueldo no alcanza, puede pedir permiso para un trabajo extra.
- **Ser buen mayordomo del tiempo.** Los miembros cumplen horarios en su trabajo y no entienden que el pastor pase mucho tiempo fuera de la iglesia.
- **Informar a los diáconos cada mes.** Cuántas visitas, funerales y bodas hizo. Un pastor descubrió así que hacía trabajo de secretaria, y la iglesia decidió contratar una.
- **Administrar el programa.** Planificar, organizar, asignar tareas, capacitar a las personas y supervisar. El pastor es la fuente de inspiración.
- **No abandonar en la crisis.** El pastor es el capitán del barco y debe ser el último en abandonarlo. En terremotos, inundaciones o accidentes, su lugar está con los miembros.
**Cuidado con el dinero:**
- No hacer negocios con los miembros. El autor compró un auto usado a un miembro y a los quince días se dañó el cigüeñal. El vendedor no asumió la responsabilidad y dejó de asistir a la iglesia.
- No arriesgar los ahorros en inversiones que prometen ganancias rápidas.
- No pedir dinero prestado a los miembros. Si lo necesita, debe acudir a la Comisión de Finanzas o a un banco.
- No prestar dinero a los miembros, porque si no pueden pagar dejan de asistir por vergüenza. La iglesia debe tener un **fondo de ayuda** para los casos de necesidad.` },
    { id: '4.2.3', t: 'La visita pastoral', b: `La visitación es una oportunidad de ministrar fuera del púlpito. Como el pastor no puede llegar a todos, debe tener **prioridades**: primero los enfermos en el hospital, luego los enfermos en casa, los que sufren una tragedia, los inconversos que pueden llegar a ser miembros y, por último, los ausentes.
**Normas para visitar en el hospital:**
1. Tocar la puerta antes de entrar y esperar que lo inviten.
2. No preguntar al paciente cuál es su enfermedad.
3. No criticar al médico ni el tratamiento.
4. No visitar cuando él mismo está enfermo.
5. No sentarse en la cama del enfermo.
6. No llevar comentarios de un cuarto a otro ni comparar casos.
7. No llevar los problemas de la iglesia al cuarto del enfermo.
8. No discutir temas de controversia.
9. No alargar la visita.
10. Ofrecer una oración si el paciente está abierto a ella.
11. Si hay familiares, hablar con ellos brevemente, pero dedicarse sobre todo al paciente.
**Otros consejos:**
- Planificar la visitación para llegar a todos los miembros durante el año, dando prioridad a los de mayor necesidad e incluyendo a los inconversos.
- No mostrar preferencia por algunas familias, porque los demás lo notarán.
- No es obligatorio leer la Biblia y orar en cada hogar. Si hay duda, es mejor preguntar si la familia lo desea.
- Por medio de las visitas se llega a familiares y vecinos. El autor visitó a una vecina que había perdido a su hijo en un accidente, y varios de esa familia empezaron a asistir a la iglesia.` },
    { id: 'Conclusión', t: 'Conclusión', b: `La relación entre el pastor y la iglesia es una de las más felices e íntimas que existen. El pastor será amado si demuestra amor.
Con los años la congregación lo quiere como de su propia familia, recuerda sus cumpleaños y aniversarios y lo acompaña en sus crisis. Dichoso el pastor que encuentra una iglesia donde predicar el evangelio y pastorear en tiempos de alegría y de tristeza.` }
  ]
},
{
  n: 5, title: 'Normas éticas en relación con la denominación', ring: 'Denominación', frase: 'Su pueblo: la ordenación, la lealtad y los estatutos.',
  resumen: {
    idea: 'El ministro debe pertenecer a su denominación por convicción, ser leal a ella y trabajar por los canales establecidos.',
    puntos: [
      'Tres preguntas: ¿Quién soy? ¿Cuál es mi evangelio? ¿Quién es mi pueblo?',
      'Se logra más en colaboración que de forma independiente.',
      'Defender a la denominación sin ser un títere.',
      'La ordenación reconoce públicamente a alguien ya probado (1 Ti 4:14).',
      'Si cambia de doctrina, debe devolver su certificado y renunciar, sin llevarse la iglesia.',
      'La autoridad se gana con una conducta sana, no con la ordenación.',
      'Aceptar la decisión de la mayoría y seguir colaborando.',
      'Conocer los estatutos y usar los canales correctos para proponer cambios.'
    ],
    recuerda: 'Aquí la ética personal se vuelve compromiso con todo un grupo de iglesias.'
  },
  subs: [
    { id: 'Intro', t: 'Introducción', b: `Se dice que cada ministro debe responder tres preguntas para ser eficaz en su ministerio:
1. **¿Quién soy yo?** La respuesta afirma su identidad como hijo de Dios y le da una autoimagen sana.
2. **¿Cuál es mi evangelio?** La respuesta aclara lo que cree sobre las doctrinas fundamentales de la fe.
3. **¿Quién es mi pueblo?** La respuesta le ayuda a saber con quién se identifica para colaborar en la obra. Aquí decide su denominación, y si será colaborador u opositor del programa de sus líderes.
Este capítulo trata de las relaciones éticas con la denominación.` },
    { id: '5.1', t: 'El pastor debe identificarse con su denominación por convicción', b: `Muchos pertenecen a una denominación porque sus padres los llevaron de niños. Otros llegaron por curiosidad, se convirtieron y se identificaron con ella. Otros nacieron en el catolicismo, estudiaron varias creencias y cambiaron de religión, aunque eso les causó conflictos con su familia.
**El testimonio del autor.** Sus padres eran bautistas, pero vivían en el campo y casi no iban a la iglesia. A los doce años se mudaron a un pueblo con iglesia bautista. Allí hizo profesión de fe, se bautizó y estudió por años en la escuela dominical y en clases doctrinales. Así llegó a ser **bautista por convicción y no por herencia**.
**Los ministros independientes.** Algunos son eficaces, pero harían mucho más en colaboración con otros. El aporte de uno solo es pequeño, pero sumado al de muchos se vuelve un gran recurso de energía y de dinero.
**Lo que exige la convicción:**
- Defender a su denominación ante ataques injustos.
- Creer las doctrinas fundamentales y practicar lo que su denominación practica.
- No ser un títere. Puede influir con su servicio fiel para cambiar lo que crea necesario, y si la denominación se aparta de la Biblia, puede llamarla a volver. Ese es un privilegio del gobierno democrático.
- Aceptar que nadie está de acuerdo en todo, pero sí en lo de mayor significado, y dar libertad a otros para pensar diferente. No hay que ser legalistas.` },
    { id: '5.2', t: 'La ordenación para el ministerio', b: `La ordenación es prerrogativa de la iglesia local, pero esta debe buscar la colaboración de las otras iglesias de su denominación, porque el ordenado podrá servir en cualquiera de ellas. Lo ético es que un grupo de pastores examine al candidato y recomiende el culto de ordenación.
**El debate.** Hoy se discute la ordenación de las mujeres y el significado mismo de ordenar. Franklin Pollard dijo que no encuentra base bíblica para la imposición de manos y que es una herejía católica que Lutero no corrigió.
**Qué es la ordenación según el libro:**
- Es reconocer públicamente a alguien **ya probado** en la predicación, la evangelización, el cuidado de las almas y el liderazgo. La iglesia solo debe ordenar a quien llena esos requisitos.
- Su base es la **«imposición de las manos del presbiterio»** (1 Ti 4:14). Es un acto simbólico que afirma lo que Dios ya hizo en la vida del ministro.
